<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NL4 Admin | Champions League</title><link rel="stylesheet" href="admin.css"><style>body{background:#070912;color:#fff}.wrap{max-width:1180px;margin:auto;padding:28px 16px 70px}.top{display:flex;justify-content:space-between;gap:15px;align-items:center;flex-wrap:wrap}.top a{color:#d8ad45;text-decoration:none;font-weight:900}.ucl-list{display:grid;gap:12px;margin-top:20px}.match{border:1px solid rgba(255,255,255,.1);border-radius:16px;background:#111827;padding:16px;display:grid;grid-template-columns:1fr auto;gap:12px}.match h3{margin:0 0 6px}.meta{color:#8993aa;font-size:11px}.score{font-size:22px;font-weight:1000;text-align:right}.edit{grid-column:1/-1}.editor{margin-top:22px;border:1px solid rgba(127,215,255,.22);border-radius:18px;background:#0b1022;padding:18px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.grid label{font-size:9px;color:#9ba5bb}.grid input,.grid select{width:100%;margin-top:5px;padding:10px;background:#080b14;color:#fff;border:1px solid #343b50;border-radius:8px}.stats{margin-top:18px}.stat{display:grid;grid-template-columns:1fr 150px 1fr;gap:8px;align-items:center;margin:7px 0}.stat span{text-align:center;font-size:9px;color:#9ba5bb}.stat input{text-align:center;padding:9px;background:#080b14;color:#fff;border:1px solid #343b50;border-radius:8px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.actions button{padding:10px 14px;border:0;border-radius:8px;font-weight:900;cursor:pointer}.primary{background:#d8ad45;color:#111}.ghost{background:#151b2c;color:#9edfff;border:1px solid #30425e!important}.msg{font-size:10px;color:#8df0b2;margin-top:10px}@media(max-width:700px){.grid{grid-template-columns:1fr}.stat{grid-template-columns:75px 1fr 75px}.match{grid-template-columns:1fr}.score{text-align:left}}</style></head><body><main class="wrap"><div class="top"><div><p>NL4 ADMIN • UEFA CHAMPIONS LEAGUE</p><h1>Champions League Match Centre</h1><p class="meta">Separate from Premier League. Updates feed the public Champions League fixture and match-details pages.</p></div><div><a href="admin.html#fanPredictionsPanel">← Main Admin / Fan Predictions</a></div></div><div id="list" class="ucl-list">Loading…</div><section id="editor" class="editor" hidden><h2 id="title">Edit UCL Match</h2><div class="grid"><label>Status<select id="status"><option value="scheduled">Scheduled</option><option value="live">Live</option><option value="fulltime">Full Time</option><option value="postponed">Postponed</option></select></label><label>Kick-off<input id="kickoff" type="datetime-local"></label><label>Venue<input id="venue"></label><label>Arsenal score<input id="arsenalScore" type="number" min="0"></label><label>Opponent score<input id="opponentScore" type="number" min="0"></label><label>Referee<input id="referee"></label><label>Half-time Arsenal<input id="htArsenal" type="number" min="0"></label><label>Half-time opponent<input id="htOpponent" type="number" min="0"></label><label>Attendance<input id="attendance" type="number" min="0"></label><label>Man of the Match<input id="motm"></label></div><div class="stats"><h3>Team Match Statistics</h3><div id="stats"></div></div><div class="actions"><button id="save" class="primary">Save Champions League Match</button><button id="close" class="ghost">Close</button><a id="preview" class="ghost" style="padding:10px 14px;border-radius:8px;text-decoration:none" target="_blank">Preview Match Details</a></div><div id="msg" class="msg"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.111.0/dist/umd/supabase.min.js"></script><script src="supabase-client.js"></script><script>(function(){const db=window.nl4Supabase,list=document.getElementById('list'),ed=document.getElementById('editor');let current=null,rows=[];const fields=[['Possession %','home_possession','away_possession'],['Shots','home_shots','away_shots'],['Shots on target','home_shots_on_target','away_shots_on_target'],['Corners','home_corners','away_corners'],['Fouls','home_fouls','away_fouls'],['Offsides','home_offsides','away_offsides'],['Saves','home_saves','away_saves']];document.getElementById('stats').innerHTML=fields.map((x,i)=>`<div class="stat"><input id="h${i}" type="number" min="0" step="${i===0?'.1':'1'}"><span>${x[0]}</span><input id="a${i}" type="number" min="0" step="${i===0?'.1':'1'}"></div>`).join('');function val(id,v){document.getElementById(id).value=v??''}async function load(){const {data,error}=await db.from('fixtures').select('*').eq('season','2026/27').eq('competition','UEFA Champions League').order('matchday');if(error){list.textContent=error.message;return}rows=data||[];list.innerHTML=rows.map(r=>`<article class="match"><div><h3>MD${r.matchday} • ${r.home_team} vs ${r.away_team}</h3><div class="meta">${new Date(r.kickoff_at).toLocaleString()} • ${r.venue||'Venue TBC'} • ${String(r.status).toUpperCase()}</div></div><div class="score">${r.arsenal_score==null?'VS':(r.is_home?r.arsenal_score+'–'+r.opponent_score:r.opponent_score+'–'+r.arsenal_score)}</div><button class="primary edit" data-id="${r.id}">Manage Match Details</button></article>`).join('')}function open(id){current=rows.find(x=>x.id===id);if(!current)return;ed.hidden=false;document.getElementById('title').textContent=`MD${current.matchday} • ${current.home_team} vs ${current.away_team}`;val('status',current.status);val('kickoff',current.kickoff_at?new Date(current.kickoff_at).toISOString().slice(0,16):'');val('venue',current.venue);val('arsenalScore',current.arsenal_score);val('opponentScore',current.opponent_score);val('referee',current.referee);val('htArsenal',current.halftime_arsenal_score);val('htOpponent',current.halftime_opponent_score);val('attendance',current.attendance);val('motm',current.man_of_the_match);fields.forEach((x,i)=>{val('h'+i,current[x[1]]);val('a'+i,current[x[2]])});document.getElementById('preview').href='champions-league-match-details.html?match='+(current.matchday-1);ed.scrollIntoView({behavior:'smooth'})}list.addEventListener('click',e=>{const b=e.target.closest('[data-id]');if(b)open(b.dataset.id)});document.getElementById('close').onclick=()=>ed.hidden=true;document.getElementById('save').onclick=async()=>{if(!current)return;const n=id=>{const v=document.getElementById(id).value;return v===''?null:Number(v)},payload={status:document.getElementById('status').value,kickoff_at:new Date(document.getElementById('kickoff').value).toISOString(),venue:document.getElementById('venue').value||null,arsenal_score:n('arsenalScore'),opponent_score:n('opponentScore'),referee:document.getElementById('referee').value||null,halftime_arsenal_score:n('htArsenal'),halftime_opponent_score:n('htOpponent'),attendance:n('attendance'),man_of_the_match:document.getElementById('motm').value||null,updated_at:new Date().toISOString()};fields.forEach((x,i)=>{payload[x[1]]=n('h'+i);payload[x[2]]=n('a'+i)});const {error}=await db.from('fixtures').update(payload).eq('id',current.id);document.getElementById('msg').textContent=error?error.message:'Champions League match saved ✓';if(!error)await load()};load()})();</script></body></html>
