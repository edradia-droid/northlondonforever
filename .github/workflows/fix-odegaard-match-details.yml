name: Fix Martin Odegaard Match Details Cutout
# 2026-10-04 execution trigger: use supplied removed-background source and refresh only Odegaard asset/cache.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  fix-odegaard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Build genuine transparent Odegaard cutout
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check rembg pillow
          curl -L --fail --retry 5 'https://i.postimg.cc/Z5HQbRkm/download-(1).jpg' -o /tmp/odegaard-source.jpg
          python - <<'PY'
          from pathlib import Path
          from rembg import remove, new_session
          from PIL import Image

          src = Path('/tmp/odegaard-source.jpg')
          dst = Path('assets/player-cutouts/player-15.png')

          source = Image.open(src).convert('RGBA')
          session = new_session('u2net_human_seg')
          result = remove(
              source,
              session=session,
              alpha_matting=True,
              alpha_matting_foreground_threshold=240,
              alpha_matting_background_threshold=10,
              alpha_matting_erode_size=10,
          )
          result = Image.open(result).convert('RGBA')

          alpha = result.getchannel('A')
          lo, hi = alpha.getextrema()
          if lo != 0 or hi < 200:
              raise SystemExit(f'Invalid alpha before save: {(lo, hi)}')

          px = result.load()
          w, h = result.size
          for x, y in ((0,0), (w-1,0), (0,h-1), (w-1,h-1)):
              px[x, y] = (0, 0, 0, 0)

          dst.parent.mkdir(parents=True, exist_ok=True)
          result.save(dst, 'PNG', optimize=True)

          with Image.open(dst).convert('RGBA') as check:
              a = check.getchannel('A')
              lo, hi = a.getextrema()
              corners = [check.getpixel(p)[3] for p in ((0,0),(check.width-1,0),(0,check.height-1),(check.width-1,check.height-1))]
              if lo != 0 or hi < 200 or any(v != 0 for v in corners):
                  raise SystemExit(f'Final transparency verification failed: alpha={(lo,hi)} corners={corners}')
              print('Verified player-15.png:', check.size, 'alpha:', (lo,hi), 'corners:', corners)
          PY

      - name: Refresh only Odegaard asset cache key
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('match-details.html')
          s = p.read_text(encoding='utf-8')
          old = 'assets/player-cutouts/player-15.png?v=20261004-4'
          new = 'assets/player-cutouts/player-15.png?v=20261004-5'
          if old not in s:
              raise SystemExit('Expected Odegaard asset reference was not found; stopping safely.')
          s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Verify only intended source changes
        shell: bash
        run: |
          git diff -- assets/player-cutouts/player-15.png match-details.html
          git diff --check
          python - <<'PY'
          from PIL import Image
          p='assets/player-cutouts/player-15.png'
          with Image.open(p).convert('RGBA') as im:
              a=im.getchannel('A')
              lo,hi=a.getextrema()
              assert lo == 0 and hi >= 200, (lo,hi)
              assert all(im.getpixel(x)[3] == 0 for x in ((0,0),(im.width-1,0),(0,im.height-1),(im.width-1,im.height-1)))
              print('Source asset verified:', im.size, (lo,hi))
          PY

      - name: Commit fixed asset and cache refresh
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/player-cutouts/player-15.png match-details.html
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Fix transparent Odegaard cutout on match details'
          git push origin HEAD:main

      - name: Dispatch NL4 Pages deployment
        shell: bash
        run: |
          gh workflow run deploy-nl4-pages.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
