name: Fix Record Room Mobile Cache V32
on:
  push:
    paths:
      - '.github/workflows/fix-record-room-mobile-cache-v32.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Force Admin onto current Record Room mobile build
        run: |
          python3 - <<'PY'
          from pathlib import Path
          a=Path('admin.html')
          x=a.read_text()
          x=x.replace('record-room.html?v=20260906-mobile-shared1','record-room.html?v=20260906-mobile-final-v35')
          x=x.replace('record-room.html?v=20260905-v34','record-room.html?v=20260906-mobile-final-v35')
          x=x.replace('record-room.html?v=20260905-v32','record-room.html?v=20260906-mobile-final-v35')
          a.write_text(x)
          PY
      - name: Verify Admin Record Room link
        run: |
          grep -q 'record-room.html?v=20260906-mobile-final-v35' admin.html
      - name: Commit
        run: |
          git config user.name 'NL4 Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add admin.html
          git commit -m 'Send Admin to final mobile Record Room build' || exit 0
          git push