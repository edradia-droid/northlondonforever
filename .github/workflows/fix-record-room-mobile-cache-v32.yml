name: Fix Record Room Mobile Cache V32
on:
  push:
    paths:
      - '.github/workflows/fix-record-room-mobile-cache-v32.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Force mobile browsers onto current Record Room shared sync
        run: |
          python3 - <<'PY'
          from pathlib import Path
          r=Path('record-room.html')
          s=r.read_text()
          if '<meta http-equiv="Cache-Control"' not in s:
              s=s.replace('<meta name="viewport" content="width=device-width,initial-scale=1.0">', '<meta name="viewport" content="width=device-width,initial-scale=1.0">\n<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">\n<meta http-equiv="Pragma" content="no-cache">\n<meta http-equiv="Expires" content="0">')
          s=s.replace('supabase-client.js?v=20260905-v34','supabase-client.js?v=20260906-mobile-shared1')
          s=s.replace('supabase-client.js?v=20260905-v32','supabase-client.js?v=20260906-mobile-shared1')
          s=s.replace('supabase-client.js?v=20260905-v30','supabase-client.js?v=20260906-mobile-shared1')
          s=s.replace('href="record-room.html?v=20260905-v34"','href="record-room.html?v=20260906-mobile-shared1"')
          s=s.replace('href="record-room.html?v=20260905-v32"','href="record-room.html?v=20260906-mobile-shared1"')
          s=s.replace('href="record-room.html"','href="record-room.html?v=20260906-mobile-shared1"')
          r.write_text(s)

          a=Path('admin.html')
          if a.exists():
              x=a.read_text()
              x=x.replace('href="record-room.html?v=20260905-v34"','href="record-room.html?v=20260906-mobile-shared1"')
              x=x.replace('href="record-room.html?v=20260905-v32"','href="record-room.html?v=20260906-mobile-shared1"')
              x=x.replace('href="record-room.html"','href="record-room.html?v=20260906-mobile-shared1"')
              x=x.replace("href='record-room.html'","href='record-room.html?v=20260906-mobile-shared1'")
              x=x.replace('location.href="record-room.html"','location.href="record-room.html?v=20260906-mobile-shared1"')
              x=x.replace("location.href='record-room.html'","location.href='record-room.html?v=20260906-mobile-shared1'")
              a.write_text(x)
          PY
      - name: Verify mobile cache fix
        run: |
          grep -q 'Cache-Control' record-room.html
          grep -q 'supabase-client.js?v=20260906-mobile-shared1' record-room.html
          node --check supabase-client.js
      - name: Commit
        run: |
          git config user.name 'NL4 Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add record-room.html admin.html
          git commit -m 'Force mobile Record Room onto current shared sync' || exit 0
          git push
