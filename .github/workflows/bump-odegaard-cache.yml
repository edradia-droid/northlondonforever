name: Bump Odegaard cutout cache key

on:
  push:
    paths:
      - ".github/workflows/bump-odegaard-cache.yml"

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump only Odegaard asset cache key
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('match-details.html')
          s=p.read_text(encoding='utf-8')
          old='assets/player-cutouts/player-15.png?v=20261004-3'
          new='assets/player-cutouts/player-15.png?v=20261004-4'
          count=s.count(old)
          if count == 0:
              raise SystemExit('Expected Odegaard cache key not found')
          s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')
          print('updated occurrences:',count)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add match-details.html
          git commit -m "Refresh Odegaard cutout asset cache key"
          git push
