name: Fix Odegaard cutout
on:
  push:
    paths:
      - ".github/workflows/fix-odegaard-cutout.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install image tools
        run: |
          python -m pip install --disable-pip-version-check "rembg[cpu]" pillow
          sudo apt-get update
          sudo apt-get install -y libgl1

      - name: Rebuild only Odegaard cutout from the existing asset
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python - <<'PY'
          from collections import deque
          from pathlib import Path
          from PIL import Image
          from rembg import remove, new_session

          dest = Path("assets/player-cutouts/player-15.png")
          if not dest.exists():
              raise FileNotFoundError(dest)

          session = new_session("isnet-general-use")

          def connected_dark_border(img, threshold=95):
              rgba = img.convert("RGBA")
              px = rgba.load()
              w, h = rgba.size
              seen = bytearray(w * h)
              q = deque()

              def seed(x, y):
                  i = y * w + x
                  if seen[i]:
                      return
                  r, g, b, a = px[x, y]
                  if a == 0 or max(r, g, b) <= threshold:
                      seen[i] = 1
                      q.append((x, y))

              for x in range(w):
                  seed(x, 0)
                  seed(x, h - 1)
              for y in range(h):
                  seed(0, y)
                  seed(w - 1, y)

              while q:
                  x, y = q.popleft()
                  r, g, b, a = px[x, y]
                  px[x, y] = (r, g, b, 0)
                  if x:
                      seed(x - 1, y)
                  if x + 1 < w:
                      seed(x + 1, y)
                  if y:
                      seed(x, y - 1)
                  if y + 1 < h:
                      seed(x, y + 1)
              return rgba

          with Image.open(dest) as src:
              src = src.convert("RGBA")
              print(f"Existing Odegaard asset: {src.size}, mode={src.mode}")
              result = remove(
                  src,
                  session=session,
                  alpha_matting=True,
                  alpha_matting_foreground_threshold=250,
                  alpha_matting_background_threshold=10,
                  alpha_matting_erode_size=15,
              )
              result = connected_dark_border(result, 95)
              result.save(dest, "PNG", optimize=True)

          with Image.open(dest) as im:
              im = im.convert("RGBA")
              alpha = im.getchannel("A")
              lo, hi = alpha.getextrema()
              hist = alpha.histogram()
              transparent = sum(hist[:10])
              total = im.width * im.height
              corners = [
                  alpha.getpixel((0, 0)),
                  alpha.getpixel((im.width - 1, 0)),
                  alpha.getpixel((0, im.height - 1)),
                  alpha.getpixel((im.width - 1, im.height - 1)),
              ]
              print(f"ODEGAARD alpha range: {lo}-{hi}")
              print(f"ODEGAARD transparent pixels (<10 alpha): {transparent}/{total} = {transparent/total:.2%}")
              print(f"ODEGAARD corners: {corners}")
              assert lo == 0, "No fully transparent pixels were produced"
              assert corners == [0, 0, 0, 0], f"Opaque corner remains: {corners}"
              assert transparent / total > 0.05, "Transparency is implausibly low; refusing to commit"

          print(f"Validated transparent Odegaard asset: {dest}")
          PY

      - name: Commit transparent cutout and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/player-cutouts/player-15.png .github/workflows/fix-odegaard-cutout.yml
          git rm .github/workflows/fix-odegaard-cutout.yml
          git commit -m "Fix Odegaard transparent player cutout"
          git push
