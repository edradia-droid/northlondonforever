name: Fix Odegaard cutout

on:
  push:
    paths:
      - ".github/workflows/fix-odegaard-cutout.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install image tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install rembg pillow
      - name: Remove background from Odegaard asset
        run: |
          python - <<'PY'
          from pathlib import Path
          from rembg import remove, new_session
          from PIL import Image
          src=Path('assets/player-cutouts/player-15.png')
          tmp=Path('/tmp/odegaard-input.png')
          out=Path('/tmp/odegaard-cutout.png')
          Image.open(src).convert('RGBA').save(tmp)
          session=new_session('u2net_human_seg')
          result=remove(tmp.read_bytes(), session=session, alpha_matting=True, alpha_matting_foreground_threshold=240, alpha_matting_background_threshold=10, alpha_matting_erode_size=10)
          out.write_bytes(result)
          with Image.open(out).convert('RGBA') as im:
              alpha=im.getchannel('A')
              lo,hi=alpha.getextrema()
              if lo != 0:
                  raise SystemExit(f'No fully transparent background found: alpha extrema={lo,hi}')
              if hi < 200:
                  raise SystemExit(f'Foreground alpha is unexpectedly weak: alpha extrema={lo,hi}')
              im.save(src)
              print('final size:', im.size)
              print('alpha extrema:', (lo,hi))
          PY
      - name: Verify cutout asset
        run: |
          python - <<'PY'
          from PIL import Image
          p='assets/player-cutouts/player-15.png'
          with Image.open(p).convert('RGBA') as im:
              a=im.getchannel('A')
              lo,hi=a.getextrema()
              assert lo == 0
              assert hi >= 200
              print('verified alpha extrema:', (lo,hi))
          PY
      - name: Commit repaired asset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/player-cutouts/player-15.png
          git diff --cached --quiet && exit 0
          git commit -m "Fix Odegaard player cutout transparency"
          git push
