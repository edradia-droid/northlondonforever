name: Deploy NL4 3D Matchday Arena

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-3d-arena.yml'
  workflow_dispatch:
    inputs:
      deploy_branch:
        description: Branch to deploy
        required: true
        default: 3d-arena-publish
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Arena branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.deploy_branch }}
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload Arena
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
