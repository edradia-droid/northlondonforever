name: Deploy NL4 3D Matchday Arena

on:
  push:
    branches:
      - 3d-arena-publish
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: nl4-3d-arena-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Arena branch
        uses: actions/checkout@v4
        with:
          ref: 3d-arena-publish
          fetch-depth: 1

      - name: Prepare clean Pages site
        run: |
          rm -rf _arena_site
          mkdir -p _arena_site
          cp index.html arena.css arena.js README.md _arena_site/
          test -s _arena_site/index.html
          test -s _arena_site/arena.css
          test -s _arena_site/arena.js
          echo "Clean Arena site prepared:"
          ls -lah _arena_site

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Arena artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _arena_site

      - name: Deploy Arena
        id: deployment
        uses: actions/deploy-pages@v4
