name: Deploy NL4 3D Matchday Arena

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-3d-arena.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Arena branch
        uses: actions/checkout@v4
        with:
          ref: 3d-arena-publish
          fetch-depth: 1

      - name: Verify Arena files
        run: |
          test -f index.html
          test -f arena.css
          test -f arena.js
          grep -q 'NL4 3D Matchday Arena' index.html
          grep -q 'WebGLRenderer' arena.js
          echo "Arena files verified."

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Arena
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
