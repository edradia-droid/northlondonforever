name: Deploy NL4 3D Matchday Arena

on:
  push:
    branches:
      - 3d-arena-publish
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: nl4-3d-arena-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Arena branch
        uses: actions/checkout@v4
        with:
          ref: 3d-arena-publish
          fetch-depth: 1

      - name: Verify Arena source
        run: |
          test -f index.html
          test -f arena.css
          test -f arena.js
          grep -q 'NL4 3D Matchday Arena' index.html
          grep -q 'initCssFallback' arena.js
          if grep -q '3D renderer unavailable' arena.js arena.css index.html; then
            echo "Old renderer error text is still present."
            exit 1
          fi
          echo "Arena source verified."

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Arena artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy Arena
        id: deployment
        uses: actions/deploy-pages@v4
