name: Deploy NL4 3D Matchday Arena

on:
  push:
    branches:
      - 3d-arena-publish
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: nl4-3d-arena-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Arena branch
        uses: actions/checkout@v4
        with:
          ref: 3d-arena-publish
          fetch-depth: 1

      - name: Verify Arena files
        run: |
          test -s index.html
          test -s arena.css
          test -s arena.js
          echo "Arena source verified."

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Arena artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy Arena
        id: deployment
        uses: actions/deploy-pages@v4
