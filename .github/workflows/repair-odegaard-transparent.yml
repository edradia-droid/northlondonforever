name: Repair Odegaard transparent cutout

on:
  push:
    paths:
      - ".github/workflows/repair-odegaard-transparent.yml"
      - "match-details.html"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install image tools
        run: |
          python -m pip install --disable-pip-version-check "rembg[cpu]" pillow scipy
          sudo apt-get update
          sudo apt-get install -y libgl1

      - name: Download the same canonical Premier League Odegaard image used by Match Details
        run: |
          curl -L --fail --retry 3 --retry-delay 2 \
            "https://assets.arsenal.com//prod/images/large_landscape/dd168c02d4e3-arsenalmenssquad26278martin-odegaard.jpg" \
            -o /tmp/odegaard-source.jpg
          test -s /tmp/odegaard-source.jpg

      - name: Rebuild only Odegaard cutout from the canonical Premier League source
        shell: python
        run: |
          from pathlib import Path
          import numpy as np
          from PIL import Image, ImageFilter
          from rembg import remove, new_session
          from scipy import ndimage

          src_path = Path("assets/player-cutouts/player-15.png")
          src = Image.open("/tmp/odegaard-source.jpg").convert("RGB")

          biref = remove(
              src,
              session=new_session("birefnet-general"),
              alpha_matting=True,
              alpha_matting_foreground_threshold=245,
              alpha_matting_background_threshold=8,
              alpha_matting_erode_size=16
          ).convert("RGBA")

          human = remove(
              src,
              session=new_session("u2net_human_seg"),
              alpha_matting=True,
              alpha_matting_foreground_threshold=240,
              alpha_matting_background_threshold=10,
              alpha_matting_erode_size=12
          ).convert("RGBA")

          general = remove(
              src,
              session=new_session("isnet-general-use"),
              alpha_matting=True,
              alpha_matting_foreground_threshold=250,
              alpha_matting_background_threshold=5,
              alpha_matting_erode_size=18
          ).convert("RGBA")

          a = np.minimum.reduce([
              np.asarray(biref.getchannel("A"), dtype=np.uint8),
              np.asarray(human.getchannel("A"), dtype=np.uint8),
              np.asarray(general.getchannel("A"), dtype=np.uint8)
          ])
          a[a < 40] = 0

          # Remove any residual dark background that remains connected to the image border.
          # This is intentionally limited to border-connected near-black pixels so dark Arsenal kit
          # areas on the player are not globally deleted.
          rgb = np.asarray(src, dtype=np.uint8)
          dark_bg = (a > 40) & (rgb.max(axis=2) <= 65)
          dark_labels, dark_n = ndimage.label(dark_bg)
          if dark_n:
              border_labels = np.unique(np.concatenate([
                  dark_labels[0, :], dark_labels[-1, :],
                  dark_labels[:, 0], dark_labels[:, -1]
              ]))
              border_labels = border_labels[border_labels != 0]
              if border_labels.size:
                  a[np.isin(dark_labels, border_labels)] = 0

          mask = a > 40
          labels, n = ndimage.label(mask)
          sizes = np.bincount(labels.ravel())
          keep_labels = np.where(sizes >= max(300, int(mask.size * 0.0003)))[0]
          a[~np.isin(labels, keep_labels)] = 0

          a[:3, :] = 0
          a[-3:, :] = 0
          a[:, :3] = 0
          a[:, -3:] = 0

          out = np.asarray(biref).copy()
          out[:, :, 3] = a
          rgba = Image.fromarray(out, "RGBA")
          rgba.putalpha(rgba.getchannel("A").filter(ImageFilter.GaussianBlur(0.3)))
          rgba.save(src_path, "PNG", optimize=True)
          print("saved", src_path, "alpha", rgba.getchannel("A").getextrema())

      - name: Verify
        shell: python
        run: |
          from PIL import Image
          p = "assets/player-cutouts/player-15.png"
          with Image.open(p) as im:
              assert im.mode == "RGBA"
              a = im.getchannel("A")
              corners = [
                  a.getpixel((0, 0)),
                  a.getpixel((im.width - 1, 0)),
                  a.getpixel((0, im.height - 1)),
                  a.getpixel((im.width - 1, im.height - 1))
              ]
              print("alpha:", a.getextrema())
              print("corners:", corners)
              assert max(corners) <= 2

      - name: Commit only Odegaard image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/player-cutouts/player-15.png
          git diff --cached --quiet || git commit -m "Strengthen Odegaard background removal"
          git fetch origin main
          git rebase origin/main
          git push
