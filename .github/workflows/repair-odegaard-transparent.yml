name: Repair Odegaard transparent cutout

on:
  push:
    paths:
      - ".github/workflows/repair-odegaard-transparent.yml"
      - "match-details.html"
      - "assets/player-cutouts/player-15.png"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install image tools
        run: |
          python -m pip install --disable-pip-version-check "rembg[cpu]" pillow scipy opencv-python-headless
          sudo apt-get update
          sudo apt-get install -y libgl1

      - name: Download the same canonical Premier League Odegaard image used by Match Details
        run: |
          curl -L --fail --retry 3 --retry-delay 2             "https://assets.arsenal.com//prod/images/large_landscape/dd168c02d4e3-arsenalmenssquad26278martin-odegaard.jpg"             -o /tmp/odegaard-source.jpg
          test -s /tmp/odegaard-source.jpg

      - name: Rebuild only Odegaard cutout with model mask plus GrabCut cleanup
        shell: python
        run: |
          from pathlib import Path
          import numpy as np
          import cv2
          from PIL import Image, ImageFilter
          from rembg import remove, new_session
          from scipy import ndimage

          src_path = Path("assets/player-cutouts/player-15.png")
          src = Image.open("/tmp/odegaard-source.jpg").convert("RGB")
          rgb = np.asarray(src, dtype=np.uint8)
          h, w = rgb.shape[:2]

          # Use the human model as the primary person seed. The previous workflow
          # took the minimum of three masks, which could preserve the same bad edge.
          human = remove(
              src,
              session=new_session("u2net_human_seg"),
              alpha_matting=True,
              alpha_matting_foreground_threshold=235,
              alpha_matting_background_threshold=12,
              alpha_matting_erode_size=8
          ).convert("RGBA")

          human_a = np.asarray(human.getchannel("A"), dtype=np.uint8)

          # Build a conservative GrabCut initialization:
          #   0 = definite background
          #   1 = probable background
          #   2 = probable foreground
          #   3 = definite foreground
          #
          # The border is always background. Strong model alpha is foreground.
          # This lets GrabCut remove the photographic backdrop while retaining
          # dark Arsenal kit regions on the player.
          gc = np.full((h, w), cv2.GC_PR_BGD, dtype=np.uint8)
          gc[:8, :] = cv2.GC_BGD
          gc[-8:, :] = cv2.GC_BGD
          gc[:, :8] = cv2.GC_BGD
          gc[:, -8:] = cv2.GC_BGD

          gc[human_a < 25] = cv2.GC_BGD
          gc[(human_a >= 25) & (human_a < 180)] = cv2.GC_PR_BGD
          gc[(human_a >= 180) & (human_a < 245)] = cv2.GC_PR_FGD
          gc[human_a >= 245] = cv2.GC_FGD

          # Keep only substantial connected model components, preventing isolated
          # background specks from becoming foreground seeds.
          seed = human_a >= 180
          labels, n = ndimage.label(seed)
          if n:
              sizes = np.bincount(labels.ravel())
              keep = np.where(sizes >= max(500, int(seed.size * 0.0005)))[0]
              strong = np.isin(labels, keep)
              gc[(seed) & (~strong)] = cv2.GC_PR_BGD

          bgd = np.zeros((1, 65), np.float64)
          fgd = np.zeros((1, 65), np.float64)
          cv2.grabCut(rgb, gc, None, bgd, fgd, 7, cv2.GC_INIT_WITH_MASK)

          mask = np.where(
              (gc == cv2.GC_FGD) | (gc == cv2.GC_PR_FGD),
              255,
              0
          ).astype(np.uint8)

          # Retain the main person component only.
          labels, n = ndimage.label(mask > 0)
          if n:
              sizes = np.bincount(labels.ravel())
              main = int(np.argmax(sizes[1:]) + 1) if len(sizes) > 1 else 0
              mask = np.where(labels == main, 255, 0).astype(np.uint8)

          # Feather the edge very slightly, but do not reintroduce the old opaque
          # backdrop. Fully transparent border is mandatory.
          alpha = cv2.GaussianBlur(mask, (0, 0), 0.7)
          alpha[:4, :] = 0
          alpha[-4:, :] = 0
          alpha[:, :4] = 0
          alpha[:, -4:] = 0

          out = np.dstack([rgb, alpha]).astype(np.uint8)
          rgba = Image.fromarray(out, "RGBA")
          rgba.putalpha(rgba.getchannel("A").filter(ImageFilter.GaussianBlur(0.15)))
          rgba.save(src_path, "PNG", optimize=True)

          a = np.asarray(rgba.getchannel("A"), dtype=np.uint8)
          print("saved", src_path)
          print("size", rgba.size)
          print("alpha", a.min(), a.max())
          print("transparent_pct", float((a == 0).mean() * 100))
          print("opaque_pct", float((a >= 250).mean() * 100))

      - name: Verify transparent cutout
        shell: python
        run: |
          python - <<'PY'
          from PIL import Image
          import numpy as np
          p = "assets/player-cutouts/player-15.png"
          with Image.open(p) as im:
              assert im.mode == "RGBA"
              a = np.asarray(im.getchannel("A"), dtype=np.uint8)
              corners = [
                  int(a[0,0]), int(a[0,-1]),
                  int(a[-1,0]), int(a[-1,-1])
              ]
              transparent_pct = float((a == 0).mean() * 100)
              print("alpha:", int(a.min()), int(a.max()))
              print("corners:", corners)
              print("transparent_pct:", transparent_pct)
              assert max(corners) <= 2
              assert transparent_pct >= 10
          PY

      - name: Commit only Odegaard image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/player-cutouts/player-15.png
          git diff --cached --quiet || git commit -m "Rebuild Odegaard cutout with GrabCut"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main || {
              git rebase --abort || true
              git reset --hard origin/main
              git add assets/player-cutouts/player-15.png
              git commit -m "Rebuild Odegaard cutout with GrabCut"
            }
            if git push; then
              exit 0
            fi
            sleep 2
          done
          echo "Unable to push Odegaard cutout after 5 attempts"
          exit 1

