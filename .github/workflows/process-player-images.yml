name: Process all player backgrounds

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/process-player-images.yml"

permissions:
  contents: write

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout clean baseline
        uses: actions/checkout@v4

      - name: Install image tools
        run: |
          python -m pip install --disable-pip-version-check "rembg[cpu]" pillow
          sudo apt-get update
          sudo apt-get install -y libgl1

      - name: Download and remove backgrounds from ALL players
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python - <<'PY'
          import os, subprocess
          from collections import deque
          from PIL import Image
          from rembg import remove, new_session

          urls = [
            "https://assets.arsenal.com//prod/images/large_landscape/5a548482772b-arsenalmenssquad26271david-raya.jpg",
            "https://assets.arsenal.com//prod/images/large_landscape/ad0f18b8d7ef-arsenalmenssquad262713kepa-arrizabalaga.jpg",
            "https://assets.arsenal.com//prod/images/large_landscape/12624e813b99-arsenalmenssquad262730illan-meslier.jpg",
            "https://assets.arsenal.com//prod/images/large_landscape/7832ccd7b5ba-arsenalmenssquad262735tommy-setford.jpg",
            "https://assets.arsenal.com//prod/images/large_landscape/acb476e282e8-2-william-saliba.jpg",
            "https://assets.arsenal.com//prod/images/large_landscape/c1658641317c-arsenalmenssquad26273cristhian-mosquera.jpg",
            "https://assets.arsenal.com//prod/images/large_landscape/c83cc5eae5b9-4-ben-white.jpg",
            "https://assets.arsenal.com//prod/images/large_landscape/6fa955383c36-arsenalmenssquad26275piero-hincapie.jpg",
            "https://assets.arsenal.com//prod/images/large_landscape/6123e9cc3496-arsenalmenssquad26276gabriel-magalhaes.jpg",
            "https://assets.arsenal.com//prod/images/large_landscape/aec7b56314c4-arsenalmenssquad262712jurrien-timber.jpg",
            "https://assets.arsenal.com//prod/images/large_landscape/21d0c9b0debd-arsenalmenssquad262715enzri-konsa.jpg",
            "https://assets.arsenal.com//prod/images/large_landscape/7e33fd9a4107-33-riccardo-calafiori.jpg",
            "https://assets.arsenal.com//prod/images/large_landscape/ba8ef1095384-arsenalmenssquad262741declan-rice.jpg",
            "https://assets.arsenal.com//prod/images/large_landscape/41f0e146d909-arsenalmenssquad262739bruno-guimaraes.jpg",
            "https://assets.arsenal.com//prod/images/large_landscape/dd168c02d4e3-arsenalmenssquad26278martin-odegaard.jpg",
            "https://assets.arsenal.com//prod/images/large_landscape/27193ebff6e1-arsenalmenssquad262736martin-zubimendi.jpg",
            "https://assets.arsenal.com//prod/images/large_landscape/a6a130950b81-arsenalmenssquad262723mikel-merino.jpg",
            "https://assets.arsenal.com//prod/images/large_landscape/9cc3c7715139-arsenalmenssquad262749myles-lewis-skelly.jpg",
            "https://assets.arsenal.com//prod/images/large_landscape/9dd24026490e-arsenalmenssquad262710eberechi-eze.jpg",
            "https://assets.arsenal.com//prod/images/large_landscape/81f9d2df3088-arsenalmenssquad262722ethan-nwaneri.jpg",
            "https://assets.arsenal.com//prod/images/large_landscape/6e39ec50e3ae-56-max-dowman.jpg",
            "https://assets.arsenal.com//prod/images/large_landscape/e1fb697fbe1b-arsenalmenssquad262717christos-tzolis.jpg",
            "https://assets.arsenal.com//prod/images/large_landscape/87fab49199d9-arsenalmenssquad26277bukayo-saka.jpg",
            "https://assets.arsenal.com//prod/images/large_landscape/444bf3ad4723-arsenalmenssquad262720noni-madueke.jpg",
            "https://assets.arsenal.com//prod/images/large_landscape/7765ab9a29eb-arsenalmenssquad262729kai-havertz.jpg",
            "https://assets.arsenal.com//prod/images/large_landscape/42b4d7ae8778-arsenalmenssquad262714viktor-gyokeres.jpg"
          ]

          os.makedirs("assets/player-cutouts", exist_ok=True)

          # IS-Net is used for every player. This avoids preserving any old
          # opaque/black-background PNG just because it happened to exist.
          session = new_session("isnet-general-use")

          def remove_border_black(img, threshold=95):
              """Remove dark pixels connected to the image border only.
              This catches black/near-black backdrops left behind by segmentation
              without deleting disconnected dark hair, boots, or kit details.
              """
              rgba = img.convert("RGBA")
              px = rgba.load()
              w, h = rgba.size
              seen = bytearray(w * h)
              q = deque()

              def add(x, y):
                  i = y * w + x
                  if seen[i]:
                      return
                  r, g, b, a = px[x, y]
                  if a == 0:
                      seen[i] = 1
                      return
                  if max(r, g, b) <= threshold:
                      seen[i] = 1
                      q.append((x, y))

              for x in range(w):
                  add(x, 0); add(x, h - 1)
              for y in range(h):
                  add(0, y); add(w - 1, y)

              while q:
                  x, y = q.popleft()
                  px[x, y] = (px[x, y][0], px[x, y][1], px[x, y][2], 0)
                  if x > 0: add(x - 1, y)
                  if x + 1 < w: add(x + 1, y)
                  if y > 0: add(x, y - 1)
                  if y + 1 < h: add(x, y + 1)

              return rgba

          for idx, url in enumerate(urls, 1):
              raw = f"/tmp/player-{idx:02d}.jpg"
              dest = f"assets/player-cutouts/player-{idx:02d}.png"

              print(f"\nProcessing player {idx}/{len(urls)}")
              subprocess.run([
                  "curl", "-L", "--fail", "--retry", "5", "--retry-delay", "3",
                  "--http1.1",
                  "-A", "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/142.0 Safari/537.36",
                  "-e", "https://www.arsenal.com/",
                  "-H", "Origin: https://www.arsenal.com",
                  "-H", "Accept: image/avif,image/webp,image/apng,image/svg+xml,image/*,*/*;q=0.8",
                  "-H", "Accept-Language: en-US,en;q=0.9",
                  "-H", "Sec-Fetch-Dest: image",
                  "-H", "Sec-Fetch-Mode: no-cors",
                  "-H", "Sec-Fetch-Site: same-site",
                  "-o", raw, url
              ], check=True)

              with Image.open(raw) as src:
                  src = src.convert("RGB")
                  result = remove(
                      src,
                      session=session,
                      alpha_matting=True,
                      alpha_matting_foreground_threshold=250,
                      alpha_matting_background_threshold=5,
                      alpha_matting_erode_size=15,
                  )
                  # Second pass specifically removes any black/near-black
                  # background still connected to the outside edge.
                  result = remove_border_black(result, threshold=95)
                  result.save(dest, "PNG", optimize=True)

              print(f"Saved rebuilt cutout {dest}")

          print(f"\nDONE: rebuilt all {len(urls)} player images.")
          PY

      - name: Verify every player image
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          files = sorted(Path("assets/player-cutouts").glob("player-*.png"))
          print(f"Generated {len(files)} player cutouts")
          assert len(files) == 26, "Expected exactly 26 player cutouts"

          for f in files:
              with Image.open(f) as im:
                  assert im.mode == "RGBA", f"{f} is not RGBA"
                  alpha = im.getchannel("A")
                  lo, hi = alpha.getextrema()
                  assert lo < 250, f"{f} has no transparent pixels"
                  # Check all four corners are transparent. A black rectangle
                  # reaching a corner means the backdrop was not removed.
                  corners = [
                      alpha.getpixel((0, 0)),
                      alpha.getpixel((im.width - 1, 0)),
                      alpha.getpixel((0, im.height - 1)),
                      alpha.getpixel((im.width - 1, im.height - 1)),
                  ]
                  assert max(corners) == 0, f"{f} still has an opaque corner: {corners}"
                  print(f"{f}: alpha range {lo}-{hi}, corners {corners}")
          PY

      - name: Commit all clean cutouts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/player-cutouts
          git diff --cached --quiet || git commit -m "Rebuild all player cutouts with transparent backgrounds"
          git push
      - name: Commit all clean cutouts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/player-cutouts
          git diff --cached --quiet || git commit -m "Rebuild all player cutouts with transparent backgrounds"
          git push
