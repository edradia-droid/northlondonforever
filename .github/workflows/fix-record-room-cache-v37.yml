name: Fix Record Room Canonical Hydration Cache V54
on:
  push:
    paths:
      - '.github/workflows/fix-record-room-cache-v37.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Force the V54 canonical hydrator URL
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('record-room.html')
          x=p.read_text(encoding='utf-8')
          old='record-room-mobile-supabase-retry.js?v=20260909-v46-meta-guard'
          new='record-room-mobile-supabase-retry.js?v=20260909-v54-canonical-player-hydration'
          if old not in x:
              raise SystemExit('old Record Room retry script URL not found')
          x=x.replace(old,new,1)
          p.write_text(x,encoding='utf-8')
          PY
      - name: Verify cache bust
        run: |
          grep -Fq 'record-room-mobile-supabase-retry.js?v=20260909-v54-canonical-player-hydration' record-room.html
          ! grep -Fq 'record-room-mobile-supabase-retry.js?v=20260909-v46-meta-guard' record-room.html
      - name: Commit patch
        run: |
          git config user.name 'NL4 Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add record-room.html
          git commit -m 'Force Record Room V54 canonical player hydrator' || exit 0
          git push
