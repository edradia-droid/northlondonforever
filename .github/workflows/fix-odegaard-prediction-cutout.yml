name: Fix Odegaard prediction cutout

on:
  push:
    paths:
      - ".github/workflows/fix-odegaard-prediction-cutout.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install image tools
        run: python -m pip install --disable-pip-version-check pillow numpy opencv-python-headless
      - name: Remove only connected black background from Odegaard
        shell: python
        run: |
          import cv2, numpy as np
          from PIL import Image
          from pathlib import Path
          p=Path("assets/player-cutouts/player-15.png")
          im=cv2.imread(str(p),cv2.IMREAD_UNCHANGED)
          if im is None: raise SystemExit("player-15.png not found")
          if im.shape[2]==3:
              bgr=im; alpha=np.full(im.shape[:2],255,np.uint8)
          else:
              bgr=im[:,:,:3]; alpha=im[:,:,3]
          rgb=cv2.cvtColor(bgr,cv2.COLOR_BGR2RGB)
          mx=rgb.max(axis=2).astype(np.int16); mn=rgb.min(axis=2).astype(np.int16)
          lum=0.299*rgb[:,:,0]+0.587*rgb[:,:,1]+0.114*rgb[:,:,2]
          bg=((lum<115)&((mx-mn)<48)&(alpha>0)).astype(np.uint8)
          mask=np.zeros(bg.shape,np.uint8)
          n,labels,stats,_=cv2.connectedComponentsWithStats(bg,8)
          for i in range(1,n):
              x,y,w,h,area=stats[i]
              if x==0 or y==0 or x+w==bg.shape[1] or y+h==bg.shape[0]:
                  mask[labels==i]=255
          dist=cv2.distanceTransform(255-mask,cv2.DIST_L2,3)
          feather=np.clip(dist/2.0,0,1)
          alpha=(alpha.astype(np.float32)*feather).astype(np.uint8)
          Image.fromarray(np.dstack([rgb,alpha]),"RGBA").save(p)
          print("transparent pixels:",int((alpha==0).sum()))
      - name: Commit only the Odegaard cutout
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/player-cutouts/player-15.png
          if git diff --cached --quiet; then
            echo "No image change generated"
          else
            git commit -m "Make Odegaard prediction cutout transparent"
            git push
          fi
