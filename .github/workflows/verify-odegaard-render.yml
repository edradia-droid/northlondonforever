name: Verify Odegaard rendered cutout

on:
  push:
    paths:
      - ".github/workflows/verify-odegaard-render.yml"

permissions:
  contents: read

jobs:
  render-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Playwright and image verification tools
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          python -m pip install --disable-pip-version-check pillow

      - name: Render Match Details player image in the real lineup styling
        run: |
          cat > render-check.js <<'JS'
          const { chromium } = require('./node_modules/playwright');
          const fs = require('fs');

          (async () => {
            const browser = await chromium.launch({headless:true});
            const page = await browser.newPage({viewport:{width:1440,height:1000}, deviceScaleFactor:1});
            await page.goto('file://' + process.cwd() + '/match-details.html', {waitUntil:'domcontentloaded'});

            await page.evaluate(() => {
              const pitch = document.querySelector('.football-pitch');
              if (!pitch) throw new Error('Real Match Details pitch element was not found.');
              pitch.innerHTML = `
                <div class="player-marker" style="--x:50%;--y:47%;--depth:1;left:50%!important;top:47%!important">
                  <span class="player-ground-shadow"></span>
                  <div class="kit-player" aria-label="Martin Ødegaard Arsenal home shirt number 8">
                    <img class="kit-player-photo" src="assets/player-cutouts/player-15.png" alt="Martin Ødegaard">
                  </div>
                  <span class="player-name"><span class="player-name-first">Martin</span><span class="player-name-last">Ødegaard</span></span>
                </div>`;
            });

            const img = page.locator('.kit-player-photo');
            await img.waitFor({state:'visible'});
            await img.evaluate(el => new Promise((resolve, reject) => {
              if (el.complete && el.naturalWidth) return resolve();
              el.onload = resolve;
              el.onerror = reject;
            }));

            const box = await img.boundingBox();
            if (!box) throw new Error('Odegaard image did not render a bounding box.');
            await page.screenshot({path:'/tmp/odegaard-render.png', fullPage:true});
            fs.writeFileSync('/tmp/odegaard-box.json', JSON.stringify(box));

            const metrics = await img.evaluate(el => ({
              src: el.getAttribute('src'),
              naturalWidth: el.naturalWidth,
              naturalHeight: el.naturalHeight,
              complete: el.complete
            }));
            console.log('rendered-image:', JSON.stringify(metrics));
            console.log('render-box:', JSON.stringify(box));
            if (!metrics.src.includes('assets/player-cutouts/player-15.png')) throw new Error('Rendered image is not player-15.png');
            if (!metrics.naturalWidth || !metrics.naturalHeight) throw new Error('Rendered image has no natural dimensions.');

            await browser.close();
          })().catch(err => { console.error(err); process.exit(1); });
          JS
          node render-check.js

      - name: Verify rendered corners show through to the pitch
        run: |
          python - <<'PY'
          from PIL import Image
          import json

          full = Image.open('/tmp/odegaard-render.png').convert('RGB')
          box = json.load(open('/tmp/odegaard-box.json'))
          x,y,w,h = [int(round(box[k])) for k in ('x','y','width','height')]
          if x+w > full.width or y+h > full.height:
              raise SystemExit(f'Rendered image box {box} falls outside full screenshot {full.size}.')

          checks = []
          for px, py, ox, oy in [
              (x, y, x-2, y),
              (x+w-1, y, x+w+1, y),
              (x, y+h-1, x-2, y+h-1),
              (x+w-1, y+h-1, x+w+1, y+h-1),
          ]:
              a = full.getpixel((max(0,px), max(0,py)))
              b = full.getpixel((max(0,min(full.width-1,ox)), max(0,min(full.height-1,oy))))
              dist = sum(abs(a[i]-b[i]) for i in range(3))
              checks.append((a,b,dist))
          print('rendered corner checks:', checks)
          close = sum(1 for _,_,dist in checks if dist <= 45)
          if close < 3:
              raise SystemExit(f'Render verification failed: only {close}/4 image corners match the surrounding pitch.')
          PY

      - name: Verify asset alpha independently
        run: |
          python - <<'PY'
          from PIL import Image
          p='assets/player-cutouts/player-15.png'
          with Image.open(p).convert('RGBA') as im:
              a=im.getchannel('A')
              print('asset alpha extrema:', a.getextrema())
              assert a.getextrema()[0] == 0
          PY

      - name: Upload rendered screenshot
        uses: actions/upload-artifact@v4
        with:
          name: odegaard-render-verification
          path: /tmp/odegaard-render.png
