name: Fix Record Room All Squads V31
on:
  push:
    paths:
      - '.github/workflows/fix-record-room-all-squads-v31.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Finish all-team Record Room binding fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('nl4-current-squad-enforcer.js')
          s=p.read_text()
          s=s.replace("const archive=[...(Array.isArray(window.db[team].historicalPlayers)?window.db[team].historicalPlayers:[])];","const archive=[...(Array.isArray(rrDb[team].historicalPlayers)?rrDb[team].historicalPlayers:[])];")
          p.write_text(s)

          r=Path('record-room.html')
          x=r.read_text()
          x=x.replace('nl4-current-squad-enforcer.js?v=20260905-v31','nl4-current-squad-enforcer.js?v=20260905-v31a')
          x=x.replace('record-room-final-squad-history-sync.js?v=20260905-v31','record-room-final-squad-history-sync.js?v=20260905-v31a')
          r.write_text(x)
          PY
      - name: Verify all 20 squad enforcement
        run: |
          node --check nl4-current-squad-enforcer.js
          grep -q "const rrDb=(typeof db!=='undefined'&&db)||window.db" nl4-current-squad-enforcer.js
          grep -q "const rrTeams=(typeof TEAMS!=='undefined'&&TEAMS)||window.TEAMS" nl4-current-squad-enforcer.js
          grep -q "Array.isArray(rrDb\[team\].historicalPlayers)" nl4-current-squad-enforcer.js
          ! grep -q "window.db\[team\]" nl4-current-squad-enforcer.js
          grep -q "nl4-current-squad-enforcer.js?v=20260905-v31a" record-room.html
      - name: Commit
        run: |
          git config user.name 'NL4 Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add nl4-current-squad-enforcer.js record-room.html
          git commit -m 'Make all 20 current squads render in Record Room' || exit 0
          git push
