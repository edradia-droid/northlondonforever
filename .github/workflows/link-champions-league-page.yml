name: Link Champions League page

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-links:
    if: ${{ !contains(github.event.head_commit.message, 'Link sidebar Champions League button') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update Champions League links
        run: |
          python - <<'PY'
          from pathlib import Path
          changed = []
          for path in Path('.').glob('*.html'):
              text = path.read_text(encoding='utf-8')
              new = text.replace('href="index.html#champions-league"', 'href="champions-league.html"')
              if new != text:
                  path.write_text(new, encoding='utf-8')
                  changed.append(str(path))
          print('Updated:', changed)
          PY
      - name: Commit links
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          git diff --cached --quiet || git commit -m "Link sidebar Champions League button"
          git push
