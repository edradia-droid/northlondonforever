name: Record Room Hydration Safety Check
on:
  workflow_dispatch:
  push:
    paths:
      - 'record-room.html'
      - 'supabase-client.js'
      - 'record-room-supabase-authority.js'
      - 'record-room-mobile-supabase-retry.js'
      - '.github/workflows/fix-record-room-mobile-final-hydration-v35.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Record Room Supabase startup safety
        run: |
          set -e
          test -f record-room.html
          test -f supabase-client.js
          test -f record-room-supabase-authority.js
          test -f record-room-mobile-supabase-retry.js
          grep -q 'record-room-supabase-authority.js' supabase-client.js
          grep -q 'record-room-mobile-supabase-retry.js' supabase-client.js
          if grep -q 'TEAMS.forEach(team=>syncTeamSeasonFromFixtures(team));' record-room.html; then
            echo 'Destructive startup recalc is present'
            exit 1
          fi
          echo 'Record Room Supabase hydration safety checks passed.'
