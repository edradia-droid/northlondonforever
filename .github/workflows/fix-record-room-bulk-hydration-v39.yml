name: Record Room V43 Display Bridge Cache Bust
on:
  push:
    paths:
      - '.github/workflows/fix-record-room-bulk-hydration-v39.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bust only the Record Room V39 helper cache
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('record-room.html')
          s=p.read_text()
          old='record-room-mobile-supabase-retry.js?v=20260909-v42-direct-bulk'
          new='record-room-mobile-supabase-retry.js?v=20260909-v43-display-bridge'
          if old not in s:
              raise SystemExit('Expected V42 Record Room bulk helper URL not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Verify V43 cache token
        shell: bash
        run: |
          grep -q 'record-room-mobile-supabase-retry.js?v=20260909-v43-display-bridge' record-room.html
      - name: Commit cache-bust only
        shell: bash
        run: |
          git config user.name 'NL4 Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add record-room.html
          git commit -m 'Force fresh Record Room V39 display bridge' || exit 0
          git push
