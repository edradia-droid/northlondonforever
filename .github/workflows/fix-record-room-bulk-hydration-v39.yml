name: Record Room V46 Metadata Guard Cache Bust
on:
  push:
    paths:
      - '.github/workflows/fix-record-room-bulk-hydration-v39.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bust only the guarded V39 helper cache
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('record-room.html')
          s=p.read_text()
          old='record-room-mobile-supabase-retry.js?v=20260909-v45-authoritative-open'
          new='record-room-mobile-supabase-retry.js?v=20260909-v46-meta-guard'
          if old not in s:
              raise SystemExit('Expected V45 Record Room helper URL not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Verify V46 cache token
        shell: bash
        run: |
          grep -q 'record-room-mobile-supabase-retry.js?v=20260909-v46-meta-guard' record-room.html
      - name: Commit cache-bust only
        shell: bash
        run: |
          git config user.name 'NL4 Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add record-room.html
          git commit -m 'Load guarded Record Room metadata helper' || exit 0
          git push
