name: Record Room V48 Metadata Runtime Cache Fix
on:
  push:
    paths:
      - '.github/workflows/fix-record-room-bulk-hydration-v39.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stop metadata rebuild loop and force fresh bootstrap
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('record-room-match-meta.js')
          s=p.read_text()
          old="new MutationObserver(()=>{if(queued)return;queued=true;requestAnimationFrame(()=>{queued=false;if(box.classList.contains('open')&&fixture()){inject();restoreSavedSelections();}})}).observe(box,{childList:true,subtree:true,attributes:true,attributeFilter:['class','data-fixture-id']});"
          new="new MutationObserver(mutations=>{if(queued)return;const shouldInject=mutations.some(m=>m.type==='attributes')||!document.getElementById('rrMatchInfoBox');if(!shouldInject)return;queued=true;requestAnimationFrame(()=>{queued=false;if(box.classList.contains('open')&&fixture()){inject();restoreSavedSelections();}})}).observe(box,{childList:true,subtree:true,attributes:true,attributeFilter:['class','data-fixture-id']});"
          if old not in s:
              raise SystemExit('Expected metadata observer block not found')
          p.write_text(s.replace(old,new,1))

          q=Path('supabase-client.js')
          t=q.read_text()
          old_loader='record-room-match-meta.js?v=20260909-v47-authoritative-meta'
          new_loader='record-room-match-meta.js?v=20260909-v48-stable-authoritative-meta'
          if old_loader not in t:
              raise SystemExit('Expected V47 metadata loader not found')
          q.write_text(t.replace(old_loader,new_loader,1))

          h=Path('record-room.html')
          u=h.read_text()
          old_boot='supabase-client.js?v=20260909-v42-direct-hydration'
          new_boot='supabase-client.js?v=20260909-v48-authoritative-meta-bootstrap'
          if old_boot not in u:
              raise SystemExit('Expected V42 Supabase bootstrap URL not found')
          h.write_text(u.replace(old_boot,new_boot,1))
          PY
      - name: Verify V48 patch
        shell: bash
        run: |
          grep -q "shouldInject=mutations.some" record-room-match-meta.js
          grep -q 'record-room-match-meta.js?v=20260909-v48-stable-authoritative-meta' supabase-client.js
          grep -q 'supabase-client.js?v=20260909-v48-authoritative-meta-bootstrap' record-room.html
      - name: Commit V48 runtime metadata fix
        shell: bash
        run: |
          git config user.name 'NL4 Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add record-room-match-meta.js supabase-client.js record-room.html
          git commit -m 'Stabilize authoritative Record Room metadata runtime' || exit 0
          git push
