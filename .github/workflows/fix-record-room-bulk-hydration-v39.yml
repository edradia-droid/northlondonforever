name: Record Room V47 Authoritative Match Metadata Source
on:
  push:
    paths:
      - '.github/workflows/fix-record-room-bulk-hydration-v39.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch authoritative metadata source and loader
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('record-room-match-meta.js')
          s=p.read_text()
          start=s.index('function dataFor(f){')
          end=s.index('\nfunction inject(){', start)
          lines=[
            'function dataFor(f){',
            ' const rec=recFor(f)||{},mi=rec.matchInfo||{},md=rec.matchDetails||{};',
            ' const auth=window.NL4RecordRoomBulkMobileHydrateV39?.getAuthoritativeInfo?.(f?.id)||{};',
            ' return {',
            '  referee:first(auth.referee,mi.referee,md.referee),',
            '  attendance:first(auth.attendance,mi.attendance,md.attendance),',
            '  venue:first(auth.venue,auth.stadium,mi.venue,mi.stadium,md.venue,md.stadium),',
            '  kickoff:first(auth.kickoff,mi.kickoff,md.kickoff,md.kickoffTime,f?.kickoff,f?.kickoffTime,f?.time),',
            '  weather:first(auth.weather,mi.weather,md.weather),',
            '  halftimeHomeScore:first(auth.halftimeHomeScore,mi.halftimeHomeScore,md.halftimeHomeScore),',
            '  halftimeAwayScore:first(auth.halftimeAwayScore,mi.halftimeAwayScore,md.halftimeAwayScore),',
            '  addedTime:first(auth.addedTime,mi.addedTime,md.addedTime),',
            '  notes:first(auth.notes,mi.notes,md.notes)',
            ' };',
            '}'
          ]
          p.write_text(s[:start]+'\n'.join(lines)+s[end:])
          q=Path('supabase-client.js')
          t=q.read_text()
          old='record-room-match-meta.js?v=20260905-v34-mobile-info2'
          new='record-room-match-meta.js?v=20260909-v47-authoritative-meta'
          if old not in t:
              raise SystemExit('Expected V34 metadata loader not found')
          q.write_text(t.replace(old,new,1))
          PY
      - name: Verify V47 patch
        shell: bash
        run: |
          grep -q 'getAuthoritativeInfo' record-room-match-meta.js
          grep -q 'record-room-match-meta.js?v=20260909-v47-authoritative-meta' supabase-client.js
      - name: Commit V47 authoritative metadata fix
        shell: bash
        run: |
          git config user.name 'NL4 Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add record-room-match-meta.js supabase-client.js
          git commit -m 'Use authoritative Supabase metadata in Record Room panel' || exit 0
          git push
