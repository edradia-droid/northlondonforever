name: Fix Record Room Hydration V41
on:
  push:
    paths:
      - '.github/workflows/fix-record-room-bulk-hydration-v39.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch V41 page marker and startup URL
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('record-room.html')
          s = p.read_text()
          s = s.replace('BUILD V38 • SUPABASE CONNECTING…', 'BUILD V41 • PAGE LOADED • WAITING FOR BULK SUPABASE…')
          s = re.sub(r'supabase-client\.js\?v=[^"\x27]+', 'supabase-client.js?v=20260908-v41-page-proof', s, count=1)
          p.write_text(s)
          PY
      - name: Verify V41 page
        run: |
          grep -q 'BUILD V41 • PAGE LOADED' record-room.html
          grep -q 'supabase-client.js?v=20260908-v41-page-proof' record-room.html
      - name: Commit V41 page proof
        run: |
          git config user.name 'NL4 Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add record-room.html
          git commit -m 'Show V41 Record Room page and force fresh startup asset' || exit 0
          git push
