name: Fix Record Room Startup Cache V40
on:
  push:
    paths:
      - '.github/workflows/fix-record-room-bulk-hydration-v39.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bust Record Room supabase-client startup cache
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('record-room.html')
          s=p.read_text()
          ns,n=re.subn(r'supabase-client\.js\?v=[^"\']+', 'supabase-client.js?v=20260908-v40-single-v39', s, count=1)
          if n != 1:
              raise SystemExit(f'Expected one supabase-client script URL, replaced {n}')
          p.write_text(ns)
          PY
      - name: Verify V40 cache boundary
        run: |
          grep -q 'supabase-client.js?v=20260908-v40-single-v39' record-room.html
      - name: Commit V40 cache bust
        run: |
          git config user.name 'NL4 Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add record-room.html
          git commit -m 'Bust Record Room startup cache for sole V39 hydrator' || exit 0
          git push
