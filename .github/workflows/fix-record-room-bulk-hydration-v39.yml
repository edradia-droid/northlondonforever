name: Fix Record Room Single Hydration V39
on:
  push:
    paths:
      - '.github/workflows/fix-record-room-bulk-hydration-v39.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Disable V38 auto hydrate and call V39 directly
        run: |
          python3 - <<'PY'
          from pathlib import Path

          a=Path('record-room-supabase-authority.js')
          s=a.read_text()
          old="function start(){hydrate().catch(e=>console.error('[NL4 Record Room] Supabase authoritative hydrate failed',e));document.addEventListener('click',e=>{"
          new="function start(){document.addEventListener('click',e=>{"
          if old not in s:
              raise SystemExit('V38 authority auto-start pattern not found')
          s=s.replace(old,new,1)
          a.write_text(s)

          p=Path('supabase-client.js')
          s=p.read_text()
          old="const finalHydrate=()=>{try{window.NL4RecordRoomSupabaseAuthority?.hydrate?.();window.NL4RecordRoomArsenalPublicSync?.hydrateFromSupabase?.();window.NL4RecordRoomBulkHydrate?.(true);}catch(err){console.warn('[NL4 Record Room] Final shared hydration failed:',err);}};"
          new="const finalHydrate=()=>{try{window.NL4RecordRoomBulkMobileHydrateV39?.hydrate?.();window.NL4RecordRoomArsenalPublicSync?.hydrateFromSupabase?.();window.NL4RecordRoomBulkHydrate?.(true);}catch(err){console.warn('[NL4 Record Room] Final shared hydration failed:',err);}};"
          if old not in s:
              raise SystemExit('supabase-client final hydration pattern not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Verify single startup hydration
        run: |
          node --check record-room-supabase-authority.js
          node --check supabase-client.js
          ! grep -q "function start(){hydrate().catch" record-room-supabase-authority.js
          grep -q "NL4RecordRoomBulkMobileHydrateV39" supabase-client.js
      - name: Commit single V39 startup
        run: |
          git config user.name 'NL4 Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add record-room-supabase-authority.js supabase-client.js
          git commit -m 'Use V39 as sole Record Room startup hydrator' || exit 0
          git push
