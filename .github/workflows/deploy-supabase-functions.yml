name: Deploy NL4 Supabase Edge Functions

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Verify Supabase credentials are configured
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || (echo "Missing SUPABASE_ACCESS_TOKEN GitHub secret" && exit 1)
          test -n "$SUPABASE_PROJECT_ID" || (echo "Missing SUPABASE_PROJECT_ID GitHub secret" && exit 1)
      - name: Deploy H2H data functions
        run: |
          supabase functions deploy sync-arsenal-pl-history --project-ref "$SUPABASE_PROJECT_ID" --use-api
          supabase functions deploy sync-football-data --project-ref "$SUPABASE_PROJECT_ID" --use-api
