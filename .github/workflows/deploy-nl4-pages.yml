name: Deploy NL4 Arsenal Website + 3D Arena
# Arena deployment refresh: 2026-09-21 Arena artwork manifest recovery
# Force publish of the authoritative Arena artwork renderer

on:
  push:
    branches:
      - main
      - 3d-arena-publish
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: nl4-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout NL4 main site
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Fetch latest 3D Arena branch
        run: |
          git fetch origin 3d-arena-publish --depth=1
          git archive origin/3d-arena-publish index.html arena.css arena.js README.md | tar -x
          mkdir -p _arena_source
          cp index.html arena.css arena.js README.md _arena_source/

      - name: Prepare NL4 Pages site
        run: |
          rm -rf _site
          mkdir -p _site
          rsync -av --exclude='.git' --exclude='.github' --exclude='_site' --exclude='_arena_source' ./ _site/
          test -s _site/index.html
          mkdir -p _site/3d-arena
          cp _arena_source/index.html _site/3d-arena/index.html
          cp _arena_source/arena.css _site/3d-arena/arena.css
          cp _arena_source/arena.js _site/3d-arena/arena.js
          cp _arena_source/README.md _site/3d-arena/README.md
          echo "NL4 root:"
          ls -lah _site/index.html
          echo "Arena:"
          ls -lah _site/3d-arena/

      - name: Build dedicated Full Body and Half Body artwork
        run: |
          rm -rf _site/3d-arena/player-assets
          mkdir -p _site/3d-arena/player-assets

          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const players = {
            'David Raya':'34148681',
            'Jurriën Timber':'34172505',
            'Ezri Konsa':'34161727',
            'Gabriel':'34172252',
            'Riccardo Calafiori':'34175834',
            'Declan Rice':'34161584',
            'Bruno Guimarães':'34172187',
            'Martin Ødegaard':'34159218',
            'Bukayo Saka':'34169884',
            'Christos Tzolis':'34193337',
            'Kai Havertz':'34169226',
            'Kepa Arrizabalaga':'34160650',
            'Piero Hincapié':'34182526',
            'Eberechi Eze':'34172278',
            'Viktor Gyökeres':'34173576',
            'Noni Madueke':'34170520',
            'Mikel Merino':'34161591',
            'Martín Zubimendi':'34172850',
            'Myles Lewis-Skelly':'34244630',
            'Max Dowman':'34432407'
          };

          const keys = {
            'David Raya':'davidraya',
            'Jurriën Timber':'jurrientimber',
            'Ezri Konsa':'ezrikonsa',
            'Gabriel':'gabriel',
            'Riccardo Calafiori':'ricardocalafiori',
            'Declan Rice':'declanrice',
            'Bruno Guimarães':'brunoguimaraes',
            'Martin Ødegaard':'martinodegaard',
            'Bukayo Saka':'bukayosaka',
            'Christos Tzolis':'christostzolis',
            'Kai Havertz':'kaihavertz',
            'Kepa Arrizabalaga':'kepaarrizabalaga',
            'Piero Hincapié':'pierohincapie',
            'Eberechi Eze':'eberechieze',
            'Viktor Gyökeres':'viktorgyokeres',
            'Noni Madueke':'nonimadueke',
            'Mikel Merino':'mikelmerino',
            'Martín Zubimendi':'martinzubimendi',
            'Myles Lewis-Skelly':'myleslewisskelly',
            'Max Dowman':'maxdowman'
          };

          const dir = '_site/3d-arena/player-assets';
          const manifest = {};

          async function getPlayer(id) {
            const response = await fetch(
              'https://www.thesportsdb.com/api/v1/json/123/lookupplayer.php?id=' + id
            );
            if (!response.ok) throw new Error('API ' + response.status + ' for ' + id);
            const json = await response.json();
            const list = Array.isArray(json.players) ? json.players : [];
            return list[0] || null;
          }

          async function download(url, filename) {
            const response = await fetch(url);
            if (!response.ok) throw new Error('image ' + response.status + ' for ' + filename);
            fs.writeFileSync(path.join(dir, filename), Buffer.from(await response.arrayBuffer()));
          }

          (async () => {
            for (const [name, id] of Object.entries(players)) {
              const key = keys[name];
              const player = await getPlayer(id);
              if (!player) throw new Error('No player data for ' + name);

              // Full Body is the dedicated cutout.
              const fullUrl = player.strCutout || null;
              // Half Body is the dedicated Player Render.
              const halfUrl = player.strRender || null;

              if (!fullUrl) throw new Error('Missing Full Body cutout for ' + name);
              if (!halfUrl) throw new Error('Missing Half Body Player Render for ' + name);

              const fullExt = (path.extname(new URL(fullUrl).pathname) || '.png').toLowerCase();
              const halfExt = (path.extname(new URL(halfUrl).pathname) || '.png').toLowerCase();

              const fullFile = key + '-full' + fullExt;
              const halfFile = key + '-half' + halfExt;

              await download(fullUrl, fullFile);
              await download(halfUrl, halfFile);

              manifest[key] = {
                full: './player-assets/' + fullFile,
                half: './player-assets/' + halfFile,
                playerId: id,
                sourceName: name
              };

              console.log('Arena artwork ready: ' + name);
            }

            fs.writeFileSync(
              path.join(dir, 'manifest.json'),
              JSON.stringify(manifest, null, 2)
            );

            console.log('Verified 20 players with dedicated Full Body cutouts and dedicated Half Body Player Renders.');
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

          test "$(node -e "const m=require('./_site/3d-arena/player-assets/manifest.json'); console.log(Object.keys(m).length)")" -eq 20
          test "$(find _site/3d-arena/player-assets -type f -name '*-full.*' | wc -l)" -eq 20
          test "$(find _site/3d-arena/player-assets -type f -name '*-half.*' | wc -l)" -eq 20
      - name: Verify Arena artwork package
        run: |
          test -s _site/3d-arena/player-assets/manifest.json
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const dir = '_site/3d-arena/player-assets';
          const manifest = JSON.parse(fs.readFileSync(path.join(dir, 'manifest.json'), 'utf8'));
          const keys = Object.keys(manifest);
          if (keys.length !== 20) throw new Error('Expected 20 players, found ' + keys.length);
          for (const [key, value] of Object.entries(manifest)) {
            if (!value || !value.full || !value.half) throw new Error('Missing full/half asset for ' + key);
            for (const mode of ['full', 'half']) {
              const rel = value[mode].replace(/^\.\//, '');
              if (!fs.existsSync(path.join('_site/3d-arena', rel))) {
                throw new Error('Missing file for ' + key + ' ' + mode + ': ' + rel);
              }
            }
          }
          console.log('Verified 20 players × 2 artwork modes.');
          NODE

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy NL4 and Arena to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
