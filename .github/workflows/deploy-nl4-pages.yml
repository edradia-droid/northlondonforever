name: Deploy NL4 Arsenal Website + 3D Arena

on:
  push:
    branches:
      - main
      - 3d-arena-publish
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: nl4-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout NL4 main site
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Fetch latest 3D Arena branch
        run: |
          git fetch origin 3d-arena-publish --depth=1
          git archive origin/3d-arena-publish index.html arena.css arena.js README.md | tar -x
          mkdir -p _arena_source
          cp index.html arena.css arena.js README.md _arena_source/

      - name: Prepare NL4 Pages site
        run: |
          rm -rf _site
          mkdir -p _site
          rsync -av --exclude='.git' --exclude='.github' --exclude='_site' --exclude='_arena_source' ./ _site/
          test -s _site/index.html
          mkdir -p _site/3d-arena
          cp _arena_source/index.html _site/3d-arena/index.html
          cp _arena_source/arena.css _site/3d-arena/arena.css
          cp _arena_source/arena.js _site/3d-arena/arena.js
          cp _arena_source/README.md _site/3d-arena/README.md
          echo "NL4 root:"
          ls -lah _site/index.html
          echo "Arena:"
          ls -lah _site/3d-arena/

      - name: Download Arsenal player artwork for Arena
        run: |
          rm -rf _site/3d-arena/player-assets
          mkdir -p _site/3d-arena/player-assets
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const players = [
            'David Raya','Jurriën Timber','Ezri Konsa','Gabriel','Riccardo Calafiori',
            'Declan Rice','Bruno Guimarães','Martin Ødegaard','Bukayo Saka','Christos Tzolis',
            'Kai Havertz','Kepa Arrizabalaga','Piero Hincapié','Eberechi Eze','Viktor Gyökeres',
            'Noni Madueke','Mikel Merino','Martín Zubimendi','Myles Lewis-Skelly','Max Dowman'
          ];

          const normalize = value => String(value || '')
            .replace(/[Øø]/g, 'o')
            .normalize('NFD')
            .replace(/[\u0300-\u036f]/g, '')
            .replace(/[^a-z0-9]+/gi, '')
            .toLowerCase();

          const manifest = {};

          async function downloadPlayer(name) {
            const key = normalize(name);
            const aliases = name === 'Gabriel'
              ? ['Gabriel_Magalhaes', 'Gabriel_Magalhães', 'Gabriel']
              : [name.replace(/\s+/g, '_')];
            try {
              let list = [];
              for (const alias of aliases) {
                const api = 'https://www.thesportsdb.com/api/v1/json/123/searchplayers.php?p=' + encodeURIComponent(alias);
                const response = await fetch(api);
                if (!response.ok) continue;
                const json = await response.json();
                if (Array.isArray(json.player)) list.push(...json.player);
              }
              const seen = new Set();
              list = list.filter(x => {
                const id = String(x.idPlayer || x.strPlayer || '');
                if (seen.has(id)) return false;
                seen.add(id);
                return true;
              });
              const arsenalPlayers = list.filter(x => String(x.strTeam || '').toLowerCase().includes('arsenal'));

              // Never fall back to an arbitrary search result. A fallback is what can
              // make one player's half-body artwork appear to belong to another player.
              const exactArsenal =
                arsenalPlayers.find(x => normalize(x.strPlayer) === key) ||
                (name === 'Gabriel'
                  ? arsenalPlayers.find(x => /gabriel.*magalh/i.test(String(x.strPlayer || '')))
                  : null);

              const player = exactArsenal;

              if (!player) {
                throw new Error('no exact Arsenal player match for ' + name);
              }

              console.log('Matched ' + name + ' -> ' + player.strPlayer + ' [' + player.idPlayer + ']');
              async function saveArtwork(url, suffix) {
                if (!url) return null;
                const imageResponse = await fetch(url);
                if (!imageResponse.ok) throw new Error('image ' + imageResponse.status);
                const buffer = Buffer.from(await imageResponse.arrayBuffer());
                const extMatch = new URL(url).pathname.match(/\.[a-z0-9]+$/i);
                const contentType = String(imageResponse.headers.get('content-type') || '').toLowerCase();
                const extFromType = contentType.includes('webp') ? 'webp' : contentType.includes('jpeg') || contentType.includes('jpg') ? 'jpg' : contentType.includes('gif') ? 'gif' : 'png';
                const ext = extMatch ? extMatch[0].slice(1).toLowerCase() : extFromType;
                const filename = key + '-' + suffix + '.' + ext;
                fs.writeFileSync(path.join('_site/3d-arena/player-assets', filename), buffer);
                return './player-assets/' + filename;
              }

              const full = await saveArtwork(fullUrl, 'full');
              const half = await saveArtwork(halfUrl, 'half');
              manifest[key] = {full, half, playerId: String(player.idPlayer || ''), sourceName: String(player.strPlayer || '')};
              console.log('Downloaded ' + name + ' (full + half)');
            } catch (error) {
              console.log('Artwork unavailable for ' + name + ': ' + error.message);
            }
          }

          (async () => {
            for (const name of players) await downloadPlayer(name);
            fs.writeFileSync('_site/3d-arena/player-assets/manifest.json', JSON.stringify(manifest, null, 2));
            console.log('Arena artwork count:', Object.keys(manifest).length);
            if (Object.keys(manifest).length === 0) console.log('No remote artwork was downloaded; Arena fallback player rendering will be used.');
          })().catch(error => { console.error(error); process.exit(1); });
          NODE

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy NL4 and Arena to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
