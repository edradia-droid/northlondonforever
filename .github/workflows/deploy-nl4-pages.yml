name: Deploy NL4 Arsenal Website + 3D Arena
# Arena deployment refresh: 2026-09-21 Arena artwork manifest recovery
# Force publish of the authoritative Arena artwork renderer

on:
  push:
    branches:
      - main
      - 3d-arena-publish
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: nl4-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout NL4 main site
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Fetch latest 3D Arena branch
        run: |
          git fetch origin 3d-arena-publish --depth=1
          git archive origin/3d-arena-publish index.html arena.css arena.js README.md | tar -x
          mkdir -p _arena_source
          cp index.html arena.css arena.js README.md _arena_source/

      - name: Prepare NL4 Pages site
        run: |
          rm -rf _site
          mkdir -p _site
          rsync -av --exclude='.git' --exclude='.github' --exclude='_site' --exclude='_arena_source' ./ _site/
          test -s _site/index.html
          mkdir -p _site/3d-arena
          cp _arena_source/index.html _site/3d-arena/index.html
          cp _arena_source/arena.css _site/3d-arena/arena.css
          cp _arena_source/arena.js _site/3d-arena/arena.js
          cp _arena_source/README.md _site/3d-arena/README.md
          echo "NL4 root:"
          ls -lah _site/index.html
          echo "Arena:"
          ls -lah _site/3d-arena/

      - name: Build true Full Body and restore dedicated Half Body artwork
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf _site/3d-arena/player-assets /tmp/arena-assets
          mkdir -p _site/3d-arena/player-assets /tmp/arena-assets

          # Restore the known-good dedicated Half Body package. These are the
          # actual half-body assets used before the renderer was rebuilt.
          curl -fL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/10617978569/zip" \
            -o /tmp/arena-assets/known-good-pages.zip
          unzip -q /tmp/arena-assets/known-good-pages.zip -d /tmp/arena-assets/pages
          mkdir -p /tmp/arena-assets/extracted
          tar -xf /tmp/arena-assets/pages/artifact.tar -C /tmp/arena-assets/extracted
          cp -a /tmp/arena-assets/extracted/3d-arena/player-assets/. _site/3d-arena/player-assets/

          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const players = {
            'David Raya':'34148681','Jurriën Timber':'34172505','Ezri Konsa':'34161727',
            'Gabriel':'34172252','Riccardo Calafiori':'34175834','Declan Rice':'34161584',
            'Bruno Guimarães':'34172187','Martin Ødegaard':'34159218','Bukayo Saka':'34169884',
            'Christos Tzolis':'34193337','Kai Havertz':'34169226','Kepa Arrizabalaga':'34160650',
            'Piero Hincapié':'34182526','Eberechi Eze':'34172278','Viktor Gyökeres':'34173576',
            'Noni Madueke':'34170520','Mikel Merino':'34161591','Martín Zubimendi':'34172850',
            'Myles Lewis-Skelly':'34244630','Max Dowman':'34432407'
          };

          const keys = {
            'David Raya':'davidraya','Jurriën Timber':'jurrientimber','Ezri Konsa':'ezrikonsa',
            'Gabriel':'gabriel','Riccardo Calafiori':'ricardocalafiori','Declan Rice':'declanrice',
            'Bruno Guimarães':'brunoguimaraes','Martin Ødegaard':'martinodegaard','Bukayo Saka':'bukayosaka',
            'Christos Tzolis':'christostzolis','Kai Havertz':'kaihavertz','Kepa Arrizabalaga':'kepaarrizabalaga',
            'Piero Hincapié':'pierohincapie','Eberechi Eze':'eberechieze','Viktor Gyökeres':'viktorgyokeres',
            'Noni Madueke':'nonimadueke','Mikel Merino':'mikelmerino','Martín Zubimendi':'martinzubimendi',
            'Myles Lewis-Skelly':'myleslewisskelly','Max Dowman':'maxdowman'
          };

          const dir = '_site/3d-arena/player-assets';
          const manifest = {};
          async function getPlayer(id) {
            const r = await fetch('https://www.thesportsdb.com/api/v1/json/123/lookupplayer.php?id=' + id);
            if (!r.ok) throw new Error('API ' + r.status + ' for ' + id);
            const j = await r.json();
            return Array.isArray(j.players) ? j.players[0] : null;
          }
          async function download(url, filename) {
            const r = await fetch(url);
            if (!r.ok) throw new Error('image ' + r.status + ' for ' + filename);
            fs.writeFileSync(path.join(dir, filename), Buffer.from(await r.arrayBuffer()));
          }

          (async () => {
            for (const [name,id] of Object.entries(players)) {
              const player = await getPlayer(id);
              if (!player || !player.strCutout) throw new Error('Missing Full Body cutout for ' + name);
              const key = keys[name];
              const fullUrl = player.strCutout;
              const ext = (path.extname(new URL(fullUrl).pathname) || '.png').toLowerCase();
              const fullFile = key + '-full' + ext;
              await download(fullUrl, fullFile);

              const halfFile = ['png','jpg','jpeg','webp']
                .map(e => key + '-half.' + e)
                .find(file => fs.existsSync(path.join(dir,file)));
              if (!halfFile) throw new Error('Missing restored Half Body for ' + name);

              manifest[key] = {
                full: './player-assets/' + fullFile,
                half: './player-assets/' + halfFile,
                playerId: id,
                sourceName: name
              };
            }
            fs.writeFileSync(path.join(dir,'manifest.json'), JSON.stringify(manifest,null,2));
            console.log('Verified 20 true Full Body cutouts + 20 restored dedicated Half Body assets.');
          })().catch(e => { console.error(e); process.exit(1); });
          NODE

          test "$(node -e "const m=require('./_site/3d-arena/player-assets/manifest.json'); console.log(Object.keys(m).length)")" -eq 20
          test "$(find _site/3d-arena/player-assets -type f -name '*-full.*' | wc -l)" -eq 20
          test "$(find _site/3d-arena/player-assets -type f -name '*-half.*' | wc -l)" -eq 20
          if find _site/3d-arena/player-assets -type f | grep -Ei 'thumb|thumbnail'; then
            echo "Unexpected thumbnail artwork detected"
            exit 1
          fi
      - name: Verify Arena artwork package
        run: |
          test -s _site/3d-arena/player-assets/manifest.json
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const dir = '_site/3d-arena/player-assets';
          const manifest = JSON.parse(fs.readFileSync(path.join(dir, 'manifest.json'), 'utf8'));
          const keys = Object.keys(manifest);
          if (keys.length !== 20) throw new Error('Expected 20 players, found ' + keys.length);
          for (const [key, value] of Object.entries(manifest)) {
            if (!value || !value.cutout || !value.render) throw new Error('Missing cutout/render asset for ' + key);
            for (const mode of ['cutout', 'render']) {
              const rel = value[mode].replace(/^\.\//, '');
              if (!fs.existsSync(path.join('_site/3d-arena', rel))) {
                throw new Error('Missing file for ' + key + ' ' + mode + ': ' + rel);
              }
            }
          }
          console.log('Verified 20 players × 2 artwork modes.');
          NODE

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy NL4 and Arena to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
