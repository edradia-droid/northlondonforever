name: Deploy NL4 Arsenal Website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: nl4-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout NL4 main site
        uses: actions/checkout@v4

      - name: Prepare NL4 Pages site
        run: |
          rm -rf _site
          mkdir -p _site
          rsync -av --exclude='.git' --exclude='.github' --exclude='_site' ./ _site/
          test -s _site/index.html
          echo "NL4 site prepared from main:"
          ls -lah _site/index.html

      - name: Upload NL4 Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy NL4 to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
