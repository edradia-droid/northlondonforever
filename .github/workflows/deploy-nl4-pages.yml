name: Deploy NL4 Arsenal Website + 3D Arena
# Arena deployment refresh: 2026-09-21 Arena artwork manifest recovery
# Calafiori cache refresh: 2026-09-21
# Force Arena rebuild: dedicated Full Body cutout + dedicated Half Body Player Render
# Force NL4 redeploy after regenerated Gabriel transparent cutout: 2026-09-23
# Temporary Odegaard cutout repair: 2026-10-04

on:
  push:
    branches:
      - main
      - 3d-arena-publish
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: nl4-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout NL4 main site
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Repair Martin Odegaard transparent cutout
        run: |
          python -m pip install --disable-pip-version-check rembg pillow
          python - <<'PY'
          from pathlib import Path
          from rembg import remove, new_session
          from PIL import Image
          src=Path('assets/player-cutouts/player-15.png')
          original=Image.open(src).convert('RGBA')
          session=new_session('u2net_human_seg')
          result=remove(original, session=session, alpha_matting=True, alpha_matting_foreground_threshold=240, alpha_matting_background_threshold=10, alpha_matting_erode_size=10)
          result=Image.open(result).convert('RGBA')
          lo,hi=result.getchannel('A').getextrema()
          if lo != 0 or hi < 200:
              raise SystemExit(f'Cutout alpha verification failed: {(lo,hi)}')
          result.save(src)
          print('Odegaard cutout repaired:', result.size, 'alpha=', (lo,hi))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/player-cutouts/player-15.png
          if ! git diff --cached --quiet; then
            git commit -m "Fix Martin Odegaard transparent player cutout [skip ci]"
            git push
          fi

      - name: Fetch latest 3D Arena branch
        run: |
          git fetch origin 3d-arena-publish --depth=1
          rm -rf _arena_source
          mkdir -p _arena_source
          git archive origin/3d-arena-publish index.html arena.css arena.js README.md | tar -x -C _arena_source

      - name: Prepare NL4 Pages site
        run: |
          rm -rf _site
          mkdir -p _site
          rsync -av --exclude='.git' --exclude='.github' --exclude='_site' --exclude='_arena_source' ./ _site/
          test -s _site/index.html
          mkdir -p _site/3d-arena
          cp _arena_source/index.html _site/3d-arena/index.html
          cp _arena_source/arena.css _site/3d-arena/arena.css
          cp _arena_source/arena.js _site/3d-arena/arena.js
          cp _arena_source/README.md _site/3d-arena/README.md
          echo "NL4 root:"
          ls -lah _site/index.html
          echo "Arena:"
          ls -lah _site/3d-arena/

      - name: Build dedicated Full Body and Half Body artwork
        run: |
          rm -rf _site/3d-arena/player-assets
          mkdir -p _site/3d-arena/player-assets

          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const players = {
            'David Raya':'34148681','Jurriën Timber':'34172505','Ezri Konsa':'34161727','Gabriel':'34172252','Riccardo Calafiori':'34175834','Declan Rice':'34161584','Bruno Guimarães':'34172187','Martin Ødegaard':'34159218','Bukayo Saka':'34169884','Christos Tzolis':'34193337','Kai Havertz':'34169226','Kepa Arrizabalaga':'34160650','Piero Hincapié':'34182526','Eberechi Eze':'34172278','Viktor Gyökeres':'34173576','Noni Madueke':'34170520','Mikel Merino':'34161591','Martín Zubimendi':'34172850','Myles Lewis-Skelly':'34244630','Max Dowman':'34432407'
          };
          const keys = {'David Raya':'davidraya','Jurriën Timber':'jurrientimber','Ezri Konsa':'ezrikonsa','Gabriel':'gabriel','Riccardo Calafiori':'ricardocalafiori','Declan Rice':'declanrice','Bruno Guimarães':'brunoguimaraes','Martin Ødegaard':'martinodegaard','Bukayo Saka':'bukayosaka','Christos Tzolis':'christostzolis','Kai Havertz':'kaihavertz','Kepa Arrizabalaga':'kepaarrizabalaga','Piero Hincapié':'pierohincapie','Eberechi Eze':'eberechieze','Viktor Gyökeres':'viktorgyokeres','Noni Madueke':'nonimadueke','Mikel Merino':'mikelmerino','Martín Zubimendi':'martinzubimendi','Myles Lewis-Skelly':'myleslewisskelly','Max Dowman':'maxdowman'};
          const dir='_site/3d-arena/player-assets'; const manifest={};
          async function getPlayer(id){const r=await fetch('https://www.thesportsdb.com/api/v1/json/123/lookupplayer.php?id='+id);if(!r.ok)throw new Error('API '+r.status+' for '+id);const j=await r.json();return Array.isArray(j.players)?j.players[0]:null;}
          async function download(url,filename){const r=await fetch(url);if(!r.ok)throw new Error('image '+r.status+' for '+filename);fs.writeFileSync(path.join(dir,filename),Buffer.from(await r.arrayBuffer()));}
          (async()=>{for(const [name,id] of Object.entries(players)){const key=keys[name],p=await getPlayer(id);if(!p)throw new Error('No player data for '+name);const fullUrl=p.strCutout,halfUrl=p.strRender;if(!fullUrl||!halfUrl)throw new Error('Missing artwork for '+name);const fullExt=(path.extname(new URL(fullUrl).pathname)||'.png').toLowerCase(),halfExt=(path.extname(new URL(halfUrl).pathname)||'.png').toLowerCase();const fullFile=key+'-full'+fullExt,halfFile=key+'-half'+halfExt;await download(fullUrl,fullFile);await download(halfUrl,halfFile);manifest[key]={full:'./player-assets/'+fullFile,half:'./player-assets/'+halfFile,playerId:id,sourceName:name};console.log('Arena artwork ready: '+name);}fs.writeFileSync(path.join(dir,'manifest.json'),JSON.stringify(manifest,null,2));fs.writeFileSync(path.join(dir,'manifest.js'),'window.ARENA_ARTWORK_MANIFEST='+JSON.stringify(manifest)+';');console.log('Verified 20 players with dedicated Full Body cutouts and dedicated Half Body Player Renders.');})().catch(e=>{console.error(e);process.exit(1)});
          NODE
          test "$(node -e "const m=require('./_site/3d-arena/player-assets/manifest.json'); console.log(Object.keys(m).length)")" -eq 20
          test "$(find _site/3d-arena/player-assets -type f -name '*-full.*' | wc -l)" -eq 20
          test "$(find _site/3d-arena/player-assets -type f -name '*-half.*' | wc -l)" -eq 20
          if find _site/3d-arena/player-assets -type f | grep -Ei 'thumb|thumbnail'; then exit 1; fi

      - name: Verify Arena artwork package
        run: |
          test -s _site/3d-arena/player-assets/manifest.json
          node <<'NODE'
          const fs=require('fs'),path=require('path'),dir='_site/3d-arena/player-assets',m=JSON.parse(fs.readFileSync(path.join(dir,'manifest.json'),'utf8'));if(Object.keys(m).length!==20)throw new Error('Expected 20 players');for(const [k,v] of Object.entries(m)){for(const mode of ['full','half']){const rel=v[mode].replace(/^\.\//,'');if(!fs.existsSync(path.join('_site/3d-arena',rel)))throw new Error('Missing '+k+' '+mode)}}console.log('Verified 20 players × 2 artwork modes.');
          NODE

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy NL4 and Arena to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
