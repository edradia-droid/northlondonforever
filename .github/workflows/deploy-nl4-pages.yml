name: Deploy NL4 Arsenal Website + 3D Arena

on:
  push:
    branches:
      - main
      - 3d-arena-publish
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  pages: write
  id-token: write

concurrency:
  group: nl4-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout NL4 main site
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Fetch latest 3D Arena branch
        run: |
          git fetch origin 3d-arena-publish --depth=1
          git archive origin/3d-arena-publish index.html arena.css arena.js README.md | tar -x
          mkdir -p _arena_source
          cp index.html arena.css arena.js README.md _arena_source/

      - name: Prepare NL4 Pages site
        run: |
          rm -rf _site
          mkdir -p _site
          rsync -av --exclude='.git' --exclude='.github' --exclude='_site' --exclude='_arena_source' ./ _site/
          test -s _site/index.html
          mkdir -p _site/3d-arena
          cp _arena_source/index.html _site/3d-arena/index.html
          cp _arena_source/arena.css _site/3d-arena/arena.css
          cp _arena_source/arena.js _site/3d-arena/arena.js
          cp _arena_source/README.md _site/3d-arena/README.md
          echo "NL4 root:"
          ls -lah _site/index.html
          echo "Arena:"
          ls -lah _site/3d-arena/

      - name: Restore Arena half-body artwork
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf _site/3d-arena/player-assets /tmp/arena-assets /tmp/arena-half-body-assets.zip /tmp/old-arena-pages.zip
          mkdir -p _site/3d-arena/player-assets /tmp/arena-assets

          # The exact half-body artwork that was already working in the Arena is
          # stored as a small release asset. This prevents the browser/deployment
          # from depending on TheSportsDB artwork fields changing underneath us.
          RELEASE_TAG="arena-player-assets-v1"
          ASSET_NAME="arena-half-body-assets.zip"

          if gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$ASSET_NAME" --dir /tmp/arena-assets --clobber; then
            echo "Restored Arena half-body artwork from GitHub release asset."
          else
            echo "Release asset not found yet; restoring it from the last known-good Pages artifact."
            curl -fL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/10615383842/zip" \
              -o /tmp/old-arena-pages.zip
            unzip -q /tmp/old-arena-pages.zip -d /tmp/arena-assets
            mkdir -p /tmp/arena-assets/extracted
            tar -xf /tmp/arena-assets/artifact.tar -C /tmp/arena-assets/extracted
            cp /tmp/arena-assets/extracted/3d-arena/player-assets/*.png _site/3d-arena/player-assets/
            cp /tmp/arena-assets/extracted/3d-arena/player-assets/manifest.json _site/3d-arena/player-assets/manifest.json

            cd _site/3d-arena/player-assets
            zip -q /tmp/arena-half-body-assets.zip *.png manifest.json
            cd -

            gh release create "$RELEASE_TAG" /tmp/arena-half-body-assets.zip \
              --repo "$GITHUB_REPOSITORY" \
              --title "NL4 Arena Half-Body Player Artwork" \
              --notes "Exact half-body player artwork recovered from the last known-good Arena deployment."
            cp /tmp/arena-half-body-assets.zip /tmp/arena-assets/$ASSET_NAME
            echo "Created persistent Arena artwork release asset."
          fi

          if [ ! -f /tmp/arena-assets/$ASSET_NAME ]; then
            echo "ERROR: Arena artwork archive was not restored."
            exit 1
          fi

          rm -rf /tmp/arena-assets/extracted
          mkdir -p /tmp/arena-assets/extracted
          unzip -q /tmp/arena-assets/$ASSET_NAME -d /tmp/arena-assets/extracted
          cp /tmp/arena-assets/extracted/*.png _site/3d-arena/player-assets/
          cp /tmp/arena-assets/extracted/manifest.json _site/3d-arena/player-assets/manifest.json

      - name: Build Arena full-body artwork
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const players = [
            'David Raya','Jurriën Timber','Ezri Konsa','Gabriel','Riccardo Calafiori',
            'Declan Rice','Bruno Guimarães','Martin Ødegaard','Bukayo Saka','Christos Tzolis',
            'Kai Havertz','Kepa Arrizabalaga','Piero Hincapié','Eberechi Eze','Viktor Gyökeres',
            'Noni Madueke','Mikel Merino','Martín Zubimendi','Myles Lewis-Skelly','Max Dowman'
          ];
          const normalize = value => String(value || '')
            .replace(/[Øø]/g, 'o').normalize('NFD').replace(/[\\u0300-\\u036f]/g, '')
            .replace(/[^a-z0-9]+/gi, '').toLowerCase();
          const manifestPath = '_site/3d-arena/player-assets/manifest.json';
          const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
          const sleep = ms => new Promise(r => setTimeout(r, ms));
          async function getPlayer(name){
            const aliases = name === 'Gabriel'
              ? ['Gabriel_Magalhaes','Gabriel_Magalhães','Gabriel']
              : [name.replace(/\\s+/g, '_')];
            let list=[];
            for(const alias of aliases){
              const res=await fetch('https://www.thesportsdb.com/api/v1/json/123/searchplayers.php?p='+encodeURIComponent(alias));
              if(!res.ok) continue;
              const json=await res.json();
              if(Array.isArray(json.player)) list.push(...json.player);
            }
            const seen=new Set();
            list=list.filter(x=>{const id=String(x.idPlayer||x.strPlayer||''); if(seen.has(id)) return false; seen.add(id); return true;});
            const arsenal=list.filter(x=>String(x.strTeam||'').toLowerCase().includes('arsenal'));
            const key=normalize(name);
            return arsenal.find(x=>normalize(x.strPlayer)===key) || (name==='Gabriel' ? arsenal.find(x=>/gabriel.*magalh/i.test(String(x.strPlayer||''))) : null);
          }
          (async()=>{
            for(const name of players){
              const player=await getPlayer(name);
              if(!player) throw new Error('No exact Arsenal player match for full body: '+name);
              const url=player.strCutout || null;
              if(!url) throw new Error('No Player Cutout artwork for full body: '+name);
              const ext=path.extname(new URL(url).pathname) || '.png';
              const key=normalize(name);
              const out='_site/3d-arena/player-assets/'+key+'-full'+ext;
              const res=await fetch(url);
              if(!res.ok) throw new Error('Failed to download full-body cutout for '+name+' ('+res.status+')');
              fs.writeFileSync(out, Buffer.from(await res.arrayBuffer()));
              manifest[key]=manifest[key] || {};
              manifest[key].full='./player-assets/'+path.basename(out);
              manifest[key].playerId=String(player.idPlayer||'');
              manifest[key].sourceName=String(player.strPlayer||'');
              console.log('Downloaded full body '+name+' -> '+player.strPlayer+' ['+player.idPlayer+']');
              await sleep(250);
            }
            fs.writeFileSync(manifestPath, JSON.stringify(manifest,null,2));
          })().catch(err=>{console.error(err);process.exit(1)});
          NODE
          test "$(find _site/3d-arena/player-assets -name '*-full.*' | wc -l)" -eq 20
          echo "Full-body artwork built for all 20 Arena players."

      - name: Embed Arena artwork manifest
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const dir = '_site/3d-arena/player-assets';
          const normalize = value => String(value || '')
            .replace(/[Øø]/g, 'o').normalize('NFD').replace(/[\\u0300-\\u036f]/g, '')
            .replace(/[^a-z0-9]+/gi, '').toLowerCase();

          // Build the runtime manifest from the actual files that were just
          // placed in the deployment. This prevents a stale/incomplete JSON
          // manifest from making every player disappear.
          const files = fs.readdirSync(dir).filter(f => /\\.(png|jpe?g|webp)$/i.test(f));
          const manifest = {};
          for (const file of files) {
            const m = file.match(/^(.+)-(full|half)\\.(png|jpe?g|webp)$/i);
            if (!m) continue;
            const key = normalize(m[1]);
            const mode = m[2].toLowerCase();
            manifest[key] = manifest[key] || {};
            manifest[key][mode] = './player-assets/' + file;
          }

          const players = [
            'David Raya','Jurriën Timber','Ezri Konsa','Gabriel','Riccardo Calafiori',
            'Declan Rice','Bruno Guimarães','Martin Ødegaard','Bukayo Saka','Christos Tzolis',
            'Kai Havertz','Kepa Arrizabalaga','Piero Hincapié','Eberechi Eze','Viktor Gyökeres',
            'Noni Madueke','Mikel Merino','Martín Zubimendi','Myles Lewis-Skelly','Max Dowman'
          ];

          for (const name of players) {
            const key = normalize(name);
            if (!manifest[key]?.full) throw new Error('Missing FULL artwork file for '+name+' ('+key+')');
            if (!manifest[key]?.half) throw new Error('Missing HALF artwork file for '+name+' ('+key+')');
          }

          fs.writeFileSync(path.join(dir,'manifest.json'), JSON.stringify(manifest,null,2)+'\\n');
          fs.writeFileSync(path.join(dir,'manifest.js'), 'window.ARENA_ARTWORK_MANIFEST='+JSON.stringify(manifest)+';\\n');
          console.log('Embedded '+players.length+' verified Arena player mappings.');
          NODE
          test -s _site/3d-arena/player-assets/manifest.js

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy NL4 and Arena to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
