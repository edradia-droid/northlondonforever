name: Deploy NL4 Arsenal Website + 3D Arena
# Arena deployment refresh: 2026-09-21 Arena artwork manifest recovery
# Calafiori cache refresh: 2026-09-21
# Force Arena rebuild: dedicated Full Body cutout + dedicated Half Body Player Render
# Force NL4 redeploy after regenerated Gabriel transparent cutout: 2026-09-23
# Odegaard cutout source repair: 2026-10-04

on:
  push:
    branches:
      - main
      - 3d-arena-publish
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: nl4-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout NL4 main site
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Fetch latest 3D Arena branch
        run: |
          git fetch origin 3d-arena-publish --depth=1
          rm -rf _arena_source
          mkdir -p _arena_source
          git archive origin/3d-arena-publish index.html arena.css arena.js README.md | tar -x -C _arena_source

      - name: Use user supplied Odegaard cutout
        run: |
          python -m pip install --disable-pip-version-check pillow
          python - <<'PY'
          import html, re, urllib.request
          from pathlib import Path
          from PIL import Image
          page = "https://postimg.cc/ppw3MHJh"
          req = urllib.request.Request(page, headers={"User-Agent":"Mozilla/5.0"})
          data = urllib.request.urlopen(req, timeout=30).read().decode("utf-8", "ignore")
          image_url = None
          for tag in re.findall(r'<meta\b[^>]*>', data, flags=re.I):
              prop = re.search(r"""property\s*=\s*["']og:image["']""", tag, re.I)
              if not prop:
                  continue
              m = re.search(r"""content\s*=\s*["']([^"']+)""", tag, re.I)
              if m:
                  image_url = html.unescape(m.group(1))
                  break
          if not image_url:
              raise SystemExit("Could not resolve the actual image from https://postimg.cc/ppw3MHJh")
          urllib.request.urlretrieve(image_url, "/tmp/odegaard-source")
          out=Path("assets/player-cutouts/player-15.png")
          Image.open("/tmp/odegaard-source").convert("RGBA").save(out)
          PY

      - name: Prepare NL4 Pages site
        run: |
          rm -rf _site
          mkdir -p _site
          rsync -av --exclude='.git' --exclude='.github' --exclude='_site' --exclude='_arena_source' ./ _site/
          test -s _site/index.html
          mkdir -p _site/3d-arena
          cp _arena_source/index.html _site/3d-arena/index.html
          cp _arena_source/arena.css _site/3d-arena/arena.css
          cp _arena_source/arena.js _site/3d-arena/arena.js
          cp _arena_source/README.md _site/3d-arena/README.md

      - name: Build dedicated Full Body and Half Body artwork
        run: |
          rm -rf _site/3d-arena/player-assets
          mkdir -p _site/3d-arena/player-assets
          node <<'NODE'
          const fs=require('fs'),path=require('path');
          const players={'David Raya':'34148681','Jurriën Timber':'34172505','Ezri Konsa':'34161727','Gabriel':'34172252','Riccardo Calafiori':'34175834','Declan Rice':'34161584','Bruno Guimarães':'34172187','Martin Ødegaard':'34159218','Bukayo Saka':'34169884','Christos Tzolis':'34193337','Kai Havertz':'34169226','Kepa Arrizabalaga':'34160650','Piero Hincapié':'34182526','Eberechi Eze':'34172278','Viktor Gyökeres':'34173576','Noni Madueke':'34170520','Mikel Merino':'34161591','Martín Zubimendi':'34172850','Myles Lewis-Skelly':'34244630','Max Dowman':'34432407'};
          const keys={'David Raya':'davidraya','Jurriën Timber':'jurrientimber','Ezri Konsa':'ezrikonsa','Gabriel':'gabriel','Riccardo Calafiori':'ricardocalafiori','Declan Rice':'declanrice','Bruno Guimarães':'brunoguimaraes','Martin Ødegaard':'martinodegaard','Bukayo Saka':'bukayosaka','Christos Tzolis':'christostzolis','Kai Havertz':'kaihavertz','Kepa Arrizabalaga':'kepaarrizabalaga','Piero Hincapié':'pierohincapie','Eberechi Eze':'eberechieze','Viktor Gyökeres':'viktorgyokeres','Noni Madueke':'nonimadueke','Mikel Merino':'mikelmerino','Martín Zubimendi':'martinzubimendi','Myles Lewis-Skelly':'myleslewisskelly','Max Dowman':'maxdowman'};
          const dir='_site/3d-arena/player-assets',manifest={};
          async function get(id){const r=await fetch('https://www.thesportsdb.com/api/v1/json/123/lookupplayer.php?id='+id);if(!r.ok)throw Error('API '+r.status);const j=await r.json();return j.players?.[0]||null}
          async function dl(url,file){const r=await fetch(url);if(!r.ok)throw Error('image '+r.status+' '+file);fs.writeFileSync(path.join(dir,file),Buffer.from(await r.arrayBuffer()))}
          (async()=>{for(const [name,id] of Object.entries(players)){const p=await get(id);if(!p?.strCutout||!p?.strRender)throw Error('Missing artwork '+name);const k=keys[name],fe=(path.extname(new URL(p.strCutout).pathname)||'.png').toLowerCase(),he=(path.extname(new URL(p.strRender).pathname)||'.png').toLowerCase();await dl(p.strCutout,k+'-full'+fe);await dl(p.strRender,k+'-half'+he);manifest[k]={full:'./player-assets/'+k+'-full'+fe,half:'./player-assets/'+k+'-half'+he,playerId:id,sourceName:name}}fs.writeFileSync(path.join(dir,'manifest.json'),JSON.stringify(manifest,null,2));fs.writeFileSync(path.join(dir,'manifest.js'),'window.ARENA_ARTWORK_MANIFEST='+JSON.stringify(manifest)+';')})().catch(e=>{console.error(e);process.exit(1)})
          NODE
          test "$(node -e "console.log(Object.keys(require('./_site/3d-arena/player-assets/manifest.json')).length)")" -eq 20
          test "$(find _site/3d-arena/player-assets -type f -name '*-full.*' | wc -l)" -eq 20
          test "$(find _site/3d-arena/player-assets -type f -name '*-half.*' | wc -l)" -eq 20

      - name: Verify Arena artwork package
        run: |
          test -s _site/3d-arena/player-assets/manifest.json

      - name: Install Pillow for asset verification
        run: python -m pip install --disable-pip-version-check pillow

      - name: Verify Odegaard transparent asset in Pages artifact
        run: |
          python - <<'PY'
          from PIL import Image
          p='_site/assets/player-cutouts/player-15.png'
          with Image.open(p).convert('RGBA') as im:
              lo,hi=im.getchannel('A').getextrema()
              print('Pages artifact Odegaard alpha:', (lo,hi), 'size:', im.size)
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy NL4 and Arena to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
