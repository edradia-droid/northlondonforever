name: Deploy NL4 Arsenal Website + 3D Arena
# Arena deployment refresh: 2026-09-21 static renderer recovery

on:
  push:
    branches:
      - main
      - 3d-arena-publish
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: nl4-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout NL4 main site
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Fetch latest 3D Arena branch
        run: |
          git fetch origin 3d-arena-publish --depth=1
          git archive origin/3d-arena-publish index.html arena.css arena.js README.md | tar -x
          mkdir -p _arena_source
          cp index.html arena.css arena.js README.md _arena_source/

      - name: Prepare NL4 Pages site
        run: |
          rm -rf _site
          mkdir -p _site
          rsync -av --exclude='.git' --exclude='.github' --exclude='_site' --exclude='_arena_source' ./ _site/
          test -s _site/index.html
          mkdir -p _site/3d-arena
          cp _arena_source/index.html _site/3d-arena/index.html
          cp _arena_source/arena.css _site/3d-arena/arena.css
          cp _arena_source/arena.js _site/3d-arena/arena.js
          cp _arena_source/README.md _site/3d-arena/README.md
          echo "NL4 root:"
          ls -lah _site/index.html
          echo "Arena:"
          ls -lah _site/3d-arena/

      - name: Download separate Arena player artwork
        run: |
          rm -rf _site/3d-arena/player-assets
          mkdir -p _site/3d-arena/player-assets
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const players = [
            'David Raya','Jurriën Timber','Ezri Konsa','Gabriel','Riccardo Calafiori',
            'Declan Rice','Bruno Guimarães','Martin Ødegaard','Bukayo Saka','Christos Tzolis',
            'Kai Havertz','Kepa Arrizabalaga','Piero Hincapié','Eberechi Eze','Viktor Gyökeres',
            'Noni Madueke','Mikel Merino','Martín Zubimendi','Myles Lewis-Skelly','Max Dowman'
          ];

          const normalize = value => String(value || '')
            .replace(/[Øø]/g, 'o')
            .normalize('NFD')
            .replace(/[\u0300-\u036f]/g, '')
            .replace(/[^a-z0-9]+/gi, '')
            .toLowerCase();

          const manifest = {};
          let fullCount = 0;
          let halfCount = 0;

          const playerIds = {
            'Gabriel': '34172252',
            'Max Dowman': '34432407'
          };

          const acceptedTeams = {
            'Max Dowman': new Set(['arsenal', 'arsenal u21'])
          };

          async function getExactArsenalPlayer(name) {
            const allowedTeams = acceptedTeams[name] || new Set(['arsenal']);
            let list = [];

            if (playerIds[name]) {
              const api = 'https://www.thesportsdb.com/api/v1/json/123/lookupplayer.php?id=' + playerIds[name];
              const response = await fetch(api);
              if (!response.ok) throw new Error('API ' + response.status);
              const json = await response.json();
              list = Array.isArray(json.players) ? json.players : [];
            } else {
              const api = 'https://www.thesportsdb.com/api/v1/json/123/searchplayers.php?p=' + encodeURIComponent(name.replace(/\s+/g, '_'));
              const response = await fetch(api);
              if (!response.ok) throw new Error('API ' + response.status);
              const json = await response.json();
              list = Array.isArray(json.player) ? json.player : [];
            }

            const key = normalize(name);
            return list.find(x =>
              (normalize(x.strPlayer) === key || playerIds[name]) &&
              allowedTeams.has(String(x.strTeam || '').trim().toLowerCase())
            ) || null;
          }

          async function downloadImage(url, filename) {
            if (!url) return null;
            const response = await fetch(url);
            if (!response.ok) throw new Error('image ' + response.status);
            const buffer = Buffer.from(await response.arrayBuffer());
            fs.writeFileSync(path.join('_site/3d-arena/player-assets', filename), buffer);
            return './player-assets/' + filename;
          }

          async function downloadPlayer(name) {
            const key = normalize(name);
            try {
              const player = await getExactArsenalPlayer(name);
              if (!player) throw new Error('exact Arsenal player not found');

              // Full Body MUST use the dedicated full-body cutout.
              // Do not fall back to render/thumbnail here: those can be portrait/half-body
              // images and are exactly what causes missing legs/boots in Full Body mode.
              const fullUrl = player.strCutout || null;

              // Half Body: Player Render first. Cutout/thumbnail are fallbacks.
              const halfUrl = player.strRender || player.strThumb || player.strCutout || null;

              if (!fullUrl) throw new Error('no dedicated full-body cutout');
              if (!halfUrl) throw new Error('no half-body artwork');

              const fullExt = (new URL(fullUrl).pathname.match(/\.[a-z0-9]+$/i) || ['.png'])[0].slice(1).toLowerCase();
              const halfExt = (new URL(halfUrl).pathname.match(/\.[a-z0-9]+$/i) || ['.png'])[0].slice(1).toLowerCase();

              const full = await downloadImage(fullUrl, key + '-full.' + fullExt);
              const half = await downloadImage(halfUrl, key + '-half.' + halfExt);

              manifest[key] = { full, half };
              if (full) fullCount++;
              if (half) halfCount++;
              console.log('Downloaded exact Arsenal artwork: ' + name);
            } catch (error) {
              console.log('Artwork unavailable for ' + name + ': ' + error.message);
            }
          }

          (async () => {
            for (const name of players) await downloadPlayer(name);

            fs.writeFileSync(
              '_site/3d-arena/player-assets/manifest.json',
              JSON.stringify(manifest, null, 2)
            );

            console.log('Arena full-body cutout count:', fullCount);
            console.log('Arena half-body artwork count:', halfCount);

            if (fullCount < 11) throw new Error('Too few full-body artworks: ' + fullCount);
            if (halfCount < 11) throw new Error('Too few half-body artworks: ' + halfCount);
            if (Object.keys(manifest).length < 20) {
              throw new Error('Not all 20 Arena players have separate artwork: ' + Object.keys(manifest).length);
            }
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Verify Arena artwork package
        run: |
          test -s _site/3d-arena/player-assets/manifest.json
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const dir = '_site/3d-arena/player-assets';
          const manifest = JSON.parse(fs.readFileSync(path.join(dir, 'manifest.json'), 'utf8'));
          const keys = Object.keys(manifest);
          if (keys.length !== 20) throw new Error('Expected 20 players, found ' + keys.length);
          for (const [key, value] of Object.entries(manifest)) {
            if (!value || !value.full || !value.half) throw new Error('Missing full/half asset for ' + key);
            for (const mode of ['full', 'half']) {
              const rel = value[mode].replace(/^\.\//, '');
              if (!fs.existsSync(path.join('_site/3d-arena', rel))) {
                throw new Error('Missing file for ' + key + ' ' + mode + ': ' + rel);
              }
            }
          }
          console.log('Verified 20 players × 2 artwork modes.');
          NODE

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy NL4 and Arena to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
