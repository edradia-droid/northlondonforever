<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Champions League Match Details | NL4</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="shared-sidebar.css">
<style>body{margin:0;background:#020817;color:#fff;font-family:Arial,sans-serif;min-height:100vh;display:grid;place-items:center}.ucl-loading{padding:28px;text-align:center;color:#d8ad45;font-weight:900;letter-spacing:.8px}</style>
</head>
<body>
<div class="ucl-loading" id="status">Opening the BSD match centre…</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.111.0/dist/umd/supabase.min.js"></script>
<script src="supabase-client.js"></script>
<script>
(async function(){
 const status=document.getElementById('status');
 const db=window.nl4Supabase;
 const params=new URLSearchParams(location.search);
 let fixtureId=params.get('fixture');
 try{
  if(!db)throw new Error('Supabase client unavailable');
  if(!fixtureId){
   const match=Number(params.get('match'));
   if(Number.isInteger(match)&&match>=0){
    const r=await db.from('fixtures').select('id').eq('season','2026/27').eq('competition','UEFA Champions League').eq('source','BSD').eq('matchday',match+1).maybeSingle();
    if(r.error)throw r.error;
    fixtureId=r.data?.id||'';
   }
  }
  if(!fixtureId)throw new Error('No Champions League fixture was selected.');
  location.replace('match-details.html?fixture='+encodeURIComponent(fixtureId));
 }catch(e){
  status.textContent=e?.message||'The Champions League match could not be opened.';
 }
})();
</script>
</body>
</html>
