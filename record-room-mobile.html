<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>NL4 Admin • Record Room</title>
<style>html,body{margin:0;min-height:100%;background:#070707;color:#fff;font-family:Arial,Helvetica,sans-serif}.boot{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}.boot b{color:#d8ad45}.boot small{display:block;color:#888;margin-top:8px}</style>
</head>
<body>
<div class="boot"><div><b>NL4 • RECORD ROOM</b><small>Loading latest shared admin records…</small></div></div>
<script>
(async()=>{
  try{
    const stamp='20260906-mobile-authority3';
    const res=await fetch(`record-room.html?entry=${stamp}&_=${Date.now()}`,{cache:'no-store',credentials:'same-origin'});
    if(!res.ok) throw new Error(`Record Room ${res.status}`);
    let html=await res.text();
    html=html.replace('supabase-client.js?v=20260905-v34',`supabase-client.js?v=${stamp}`);
    html=html.replace('record-room.html?v=20260905-v34',`record-room-mobile.html?v=${stamp}`);
    document.open();
    document.write(html);
    document.close();
  }catch(err){
    console.error('[NL4 Record Room] Mobile entry failed:',err);
    document.body.innerHTML='<div class="boot"><div><b>RECORD ROOM LOAD FAILED</b><small>Refresh this page to retry.</small></div></div>';
  }
})();
</script>
</body>
</html>
