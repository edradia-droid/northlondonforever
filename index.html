<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08140f"><title>NL4 3D Matchday Arena</title><link rel="stylesheet" href="./arena.css?v=20260921-15">\n</head>
<body><div id="app">
