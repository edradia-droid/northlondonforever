<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="NL4 Champions League score and Arsenal lineup prediction."><title>Champions League Match Prediction | NL4</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#050611;color:#fff;font-family:Arial,sans-serif}.shell{max-width:1120px;margin:auto;padding:28px 14px 60px}.back{color:#d8ad45;text-decoration:none;font-weight:900;display:inline-block;margin-bottom:16px}.hero,.card{background:linear-gradient(145deg,#101632,#080914);border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:18px}.hero{margin-bottom:15px}.eyebrow{font-size:9px;font-weight:1000;letter-spacing:1.2px;color:#d8ad45}.hero h1{margin:6px 0;font-size:clamp(27px,5vw,46px)}.muted{font-size:10px;color:#8b90a4;line-height:1.5}.grid{display:grid;grid-template-columns:340px 1fr;gap:15px}.score-row{display:grid;grid-template-columns:1fr 52px auto 52px 1fr;gap:7px;align-items:center;margin-top:15px}.score-row strong{text-align:center;font-size:11px}.score-row input{width:100%;padding:11px 5px;text-align:center;background:#0c0e1a;color:#fff;border:1px solid #34394f;border-radius:9px;font-weight:1000}.vs{color:#d8ad45;font-weight:1000}.btn{background:#d8ad45;color:#111;border:0;border-radius:9px;padding:11px 13px;font-weight:1000;cursor:pointer;margin-top:12px}.msg{display:block;margin-top:9px;color:#94dca3;font-size:9px}.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:11px}.controls label{font-size:8px;color:#9ba0b2;font-weight:900}.controls select,.slot select{width:100%;background:#0d101e;color:#fff;border:1px solid #34394f;border-radius:8px;padding:8px;margin-top:4px}.pitch-wrap{position:relative;width:100%;min-height:650px;border-radius:16px;overflow:hidden;border:3px solid #fff;background:#247d3e;box-shadow:0 24px 44px rgba(0,0,0,.36)}.pitch{position:absolute;inset:0;background:repeating-linear-gradient(0deg,#2f9148 0 10%,#278442 10% 20%)}.pitch:before{content:"";position:absolute;inset:5%;border:2px solid rgba(255,255,255,.88)}.pitch:after{content:"";position:absolute;left:5%;right:5%;top:50%;height:2px;background:rgba(255,255,255,.88)}.circle{position:absolute;left:50%;top:50%;width:105px;height:105px;border:2px solid rgba(255,255,255,.88);border-radius:50%;transform:translate(-50%,-50%)}.box{position:absolute;left:50%;width:48%;height:17%;border:2px solid rgba(255,255,255,.88);transform:translateX(-50%)}.box.top{top:5%;border-top:0}.box.bottom{bottom:5%;border-bottom:0}.slot{position:absolute;transform:translate(-50%,-50%);width:108px;text-align:center;z-index:3}.shirt{width:50px;height:58px;margin:0 auto 3px;position:relative;background:linear-gradient(90deg,#fff 0 18%,#c8102e 18% 82%,#fff 82% 100%);clip-path:polygon(18% 0,35% 9%,65% 9%,82% 0,100% 20%,86% 34%,81% 100%,19% 100%,14% 34%,0 20%);filter:drop-shadow(0 4px 4px #000)}body[data-kit="away"] .shirt{background:linear-gradient(90deg,#f3d329 0 18%,#1c58b6 18% 82%,#f3d329 82% 100%)}.slot-num{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-weight:1000;text-shadow:0 2px 4px #000}.slot-name{font-size:7px;font-weight:1000;text-shadow:0 2px 3px #000;margin-bottom:2px}.slot select{font-size:7px;padding:6px 3px;background:rgba(5,5,5,.92)}.subs-title{margin:14px 0 7px;color:#d8ad45;font-size:8px;font-weight:1000}.subs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.sub{display:flex;gap:6px;align-items:center;background:#0c0e1a;border:1px solid #292e44;border-radius:8px;padding:7px;font-size:8px}.sub input{accent-color:#d8ad45}@media(max-width:850px){.grid{grid-template-columns:1fr}.pitch-wrap{min-height:570px}}@media(max-width:520px){.pitch-wrap{min-height:520px}.slot{width:80px}.shirt{width:42px;height:49px}.slot select{font-size:6px;padding:5px 2px}.subs{grid-template-columns:1fr}.score-row{grid-template-columns:1fr 45px auto 45px 1fr}}
</style></head>
<body data-kit="home"><div class="shell"><a id="backLink" class="back" href="champions-league.html#fixtures">← Back to Champions League Fixtures</a><section class="hero"><div class="eyebrow">NL4 • UEFA CHAMPIONS LEAGUE • FAN PREDICTION</div><h1 id="heading">Loading fixture…</h1><div id="meta" class="muted"></div></section><div class="grid"><section class="card"><div class="eyebrow">MATCH PREDICTION</div><h2>Predict the Score</h2><p class="muted">Enter your score prediction for this Champions League fixture.</p><div class="score-row"><strong id="homeTeam">Home</strong><input id="homeScore" type="number" min="0" max="30" value="0"><span class="vs">–</span><input id="awayScore" type="number" min="0" max="30" value="0"><strong id="awayTeam">Away</strong></div><button id="saveScore" class="btn" type="button">Save Score Prediction</button><span id="scoreMsg" class="msg"></span></section><section class="card"><div class="eyebrow">STARTING XI PREDICTION</div><h2>Build Your Arsenal XI</h2><div class="controls"><label>FORMATION<select id="formation"><option>4-3-3</option><option>4-2-3-1</option><option>4-4-2</option><option>3-4-3</option><option>3-5-2</option></select></label><label>SHIRT<select id="kit"><option value="home">Home • Red/White</option><option value="away">Away • Yellow/Blue</option></select></label></div><div class="pitch-wrap"><div id="pitch" class="pitch"><span class="circle"></span><span class="box top"></span><span class="box bottom"></span></div></div><div class="subs-title">SUBSTITUTES • choose up to 9</div><div id="subs" class="subs"></div><button id="saveLineup" class="btn" type="button">Save Lineup Prediction</button><span id="lineupMsg" class="msg"></span></section></div></div>
<script>
(function(){
const fixtures=[['09 SEP 2026','Napoli','AWAY','MD1','21:00 CET'],['13 OCT 2026','Lille','HOME','MD2','21:00 CET'],['21 OCT 2026','Bayern München','AWAY','MD3','21:00 CET'],['04 NOV 2026','Slavia Praha','AWAY','MD4','21:00 CET'],['24 NOV 2026','Borussia Dortmund','HOME','MD5','21:00 CET'],['09 DEC 2026','Real Madrid','HOME','MD6','21:00 CET'],['20 JAN 2027','Real Betis','AWAY','MD7','21:00 CET'],['27 JAN 2027','Sabah','HOME','MD8','21:00 CET']];
const squad=['David Raya','Kepa Arrizabalaga','Tommy Setford','Ben White','William Saliba','Gabriel Magalhães','Jurriën Timber','Riccardo Calafiori','Cristhian Mosquera','Piero Hincapié','Myles Lewis-Skelly','Declan Rice','Martin Ødegaard','Martín Zubimendi','Mikel Merino','Eberechi Eze','Ethan Nwaneri','Max Dowman','Bukayo Saka','Viktor Gyökeres','Noni Madueke','Kai Havertz','Gabriel Jesus','Christos Tzolis'];
const formations={'4-3-3':[['GK',50,90],['LB',15,72],['LCB',38,72],['RCB',62,72],['RB',85,72],['LCM',27,49],['CM',50,52],['RCM',73,49],['LW',18,23],['ST',50,17],['RW',82,23]],'4-2-3-1':[['GK',50,90],['LB',15,72],['LCB',38,72],['RCB',62,72],['RB',85,72],['LDM',38,56],['RDM',62,56],['LAM',20,34],['CAM',50,31],['RAM',80,34],['ST',50,15]],'4-4-2':[['GK',50,90],['LB',15,72],['LCB',38,72],['RCB',62,72],['RB',85,72],['LM',15,47],['LCM',38,50],['RCM',62,50],['RM',85,47],['LST',38,20],['RST',62,20]],'3-4-3':[['GK',50,90],['LCB',28,70],['CB',50,73],['RCB',72,70],['LM',13,48],['LCM',38,51],['RCM',62,51],['RM',87,48],['LW',18,22],['ST',50,17],['RW',82,22]],'3-5-2':[['GK',50,90],['LCB',28,71],['CB',50,74],['RCB',72,71],['LWB',12,48],['LCM',34,51],['CM',50,47],['RCM',66,51],['RWB',88,48],['LST',38,20],['RST',62,20]]};
const params=new URLSearchParams(location.search);let idx=Number(params.get('match'));if(!Number.isInteger(idx)||idx<0||idx>=fixtures.length)idx=0;const [date,opponent,venue,md,time]=fixtures[idx];const home=venue==='HOME'?'Arsenal':opponent;const away=venue==='HOME'?opponent:'Arsenal';const key='nl4-ucl-prediction-'+idx;document.getElementById('heading').textContent=home+' vs '+away;document.getElementById('meta').textContent=md+' • '+date+' • '+time+' • UEFA Champions League';document.getElementById('homeTeam').textContent=home;document.getElementById('awayTeam').textContent=away;document.getElementById('backLink').href='champions-league-match-details.html?match='+idx;
function options(selected){return '<option value="">Select player</option>'+squad.map(p=>'<option'+(p===selected?' selected':'')+'>'+p+'</option>').join('')}
function renderPitch(saved){const formation=document.getElementById('formation').value;const slots=formations[formation]||formations['4-3-3'];const old=[...document.querySelectorAll('.slot select')].map(s=>s.value);document.querySelectorAll('.slot').forEach(x=>x.remove());slots.forEach((s,i)=>{const el=document.createElement('div');el.className='slot';el.style.left=s[1]+'%';el.style.top=s[2]+'%';const picked=(saved&&saved[i])||old[i]||'';el.innerHTML='<div class="shirt"><span class="slot-num">'+(i+1)+'</span></div><div class="slot-name">'+s[0]+'</div><select aria-label="'+s[0]+'">'+options(picked)+'</select>';document.getElementById('pitch').appendChild(el)})}
function renderSubs(saved){document.getElementById('subs').innerHTML=squad.map(p=>'<label class="sub"><input type="checkbox" value="'+p+'"'+(saved&&saved.includes(p)?' checked':'')+'>'+p+'</label>').join('');document.getElementById('subs').addEventListener('change',e=>{if(e.target.checked&&document.querySelectorAll('#subs input:checked').length>9){e.target.checked=false;document.getElementById('lineupMsg').textContent='Choose a maximum of 9 substitutes.'}})}
let saved={};try{saved=JSON.parse(localStorage.getItem(key)||'{}')}catch(e){}if(saved.formation)document.getElementById('formation').value=saved.formation;if(saved.kit)document.getElementById('kit').value=saved.kit;document.body.dataset.kit=document.getElementById('kit').value;if(Number.isFinite(saved.homeScore))document.getElementById('homeScore').value=saved.homeScore;if(Number.isFinite(saved.awayScore))document.getElementById('awayScore').value=saved.awayScore;renderPitch(saved.xi);renderSubs(saved.subs);
document.getElementById('formation').addEventListener('change',()=>renderPitch());document.getElementById('kit').addEventListener('change',e=>document.body.dataset.kit=e.target.value);document.getElementById('saveScore').addEventListener('click',()=>{saved.homeScore=Number(document.getElementById('homeScore').value);saved.awayScore=Number(document.getElementById('awayScore').value);localStorage.setItem(key,JSON.stringify(saved));document.getElementById('scoreMsg').textContent='Score prediction saved on this device.'});document.getElementById('saveLineup').addEventListener('click',()=>{const xi=[...document.querySelectorAll('.slot select')].map(s=>s.value);const chosen=xi.filter(Boolean);if(chosen.length!==11){document.getElementById('lineupMsg').textContent='Select all 11 starting players before saving.';return}if(new Set(chosen).size!==chosen.length){document.getElementById('lineupMsg').textContent='A player can only be selected once.';return}saved.formation=document.getElementById('formation').value;saved.kit=document.getElementById('kit').value;saved.xi=xi;saved.subs=[...document.querySelectorAll('#subs input:checked')].map(x=>x.value);localStorage.setItem(key,JSON.stringify(saved));document.getElementById('lineupMsg').textContent='Champions League lineup prediction saved on this device.'});
})();
</script></body></html>
